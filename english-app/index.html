<title>מחברת אנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Andika:wght@400;700&display=swap">
<style>
/* מחברת: דף לבן על שולחן אפור-כחול. מילים באנגלית נכתבות על ארבע שורות כמו במחברת אנגלית. צבע אחד לכל ילדה. */
:root{
  --bg:#EDF0F5;--surface:#FFFFFF;--ink:#1E2633;--muted:#5A6577;--line:#D3DAE3;
  --rule:#B9C8E4;--margin:#E07A8A;--hl:#FFE89A;--hint-bg:#FFF1C9;
  --good:#1F7A4D;--good-soft:#DDF2E7;--soft:#F4F6FA;
  --grape:#7444C9;--sea:#14809A;--coral:#D2553B;--leaf:#3F8A2E;--rose:#C23C7E;--blue:#2F5BD3;
  --accent:var(--grape);
  --f-body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --f-en:"Andika","Comic Sans MS",system-ui,sans-serif;
  --r-x:.78;--r-top:.42;--r-base:1.3;--r-desc:1.55;--r-lh:1.9;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D;--surface:#1B212B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2E3746;
  --rule:#34425E;--margin:#A9505F;--hl:#5A4B17;--hint-bg:#3D3420;
  --good:#3FB37A;--good-soft:#1C3A2B;--soft:#222935;
  --grape:#A07CF0;--sea:#3DB2CC;--coral:#F07F63;--leaf:#6EC25A;--rose:#EE6AA8;--blue:#7096F4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D;--surface:#1B212B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2E3746;
  --rule:#34425E;--margin:#A9505F;--hl:#5A4B17;--hint-bg:#3D3420;
  --good:#3FB37A;--good-soft:#1C3A2B;--soft:#222935;
  --grape:#A07CF0;--sea:#3DB2CC;--coral:#F07F63;--leaf:#6EC25A;--rose:#EE6AA8;--blue:#7096F4;
  color-scheme:dark}
.c-grape{--accent:var(--grape)}.c-sea{--accent:var(--sea)}.c-coral{--accent:var(--coral)}
.c-leaf{--accent:var(--leaf)}.c-rose{--accent:var(--rose)}.c-blue{--accent:var(--blue)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* frame */
.wrap{max-width:880px;margin-inline:auto;padding-block:16px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:600;font-size:22px;display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 16px 6px 8px;border-radius:999px;border:2px solid var(--line);background:var(--surface)}
.chip:hover{border-color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600}
.icon-btn{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:22px;height:22px}

.sheet{background:var(--surface);border-radius:20px;padding:clamp(18px,4vw,36px);position:relative;display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 0 var(--line)}
.sheet.paper{background-image:linear-gradient(90deg,transparent calc(100% - 46px),var(--margin) calc(100% - 46px),var(--margin) calc(100% - 44px),transparent calc(100% - 44px));padding-inline-start:clamp(56px,8vw,72px)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(26px,4vw,34px);font-weight:600}
h2{font-size:24px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.lead{font-size:20px;color:var(--muted);max-width:34em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{min-height:52px;padding:8px 22px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:40px;padding:4px 14px;font-size:16px}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;padding:4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:16px}

/* four-line English ruling */
.ruled{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate;text-align:center;line-height:calc(var(--r-lh)*1em);padding-inline:.3em;
  --l:var(--rule);
  background-image:
    linear-gradient(transparent calc(var(--r-top)*1em),var(--l) calc(var(--r-top)*1em),var(--l) calc(var(--r-top)*1em + 1px),transparent calc(var(--r-top)*1em + 1px)),
    linear-gradient(transparent calc(var(--r-x)*1em),var(--l) calc(var(--r-x)*1em),var(--l) calc(var(--r-x)*1em + 1px),transparent calc(var(--r-x)*1em + 1px)),
    linear-gradient(transparent calc(var(--r-base)*1em - 1px),var(--margin) calc(var(--r-base)*1em - 1px),var(--margin) calc(var(--r-base)*1em + 1px),transparent calc(var(--r-base)*1em + 1px)),
    linear-gradient(transparent calc(var(--r-desc)*1em),var(--l) calc(var(--r-desc)*1em),var(--l) calc(var(--r-desc)*1em + 1px),transparent calc(var(--r-desc)*1em + 1px));
  background-size:100% calc(var(--r-lh)*1em);background-repeat:repeat-y}
.word-big{font-size:clamp(40px,8vw,64px);font-weight:700;overflow-wrap:anywhere}
.word-mid{font-size:clamp(28px,5vw,40px);font-weight:700;overflow-wrap:anywhere}

/* home: pick a girl */
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kid-card{display:flex;align-items:center;gap:16px;padding:22px;border-radius:20px;border:3px solid var(--accent);background:var(--surface);text-align:start;min-height:110px}
.kid-card:hover{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.kid-card .avatar{width:64px;height:64px;font-size:28px}
.kid-card b{font-size:26px;display:block}
.kid-card span{color:var(--muted);font-size:16px}

/* kid home */
.today{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px;border-radius:20px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.today .txt{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.today b{font-size:22px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:16px}
.meta strong{color:var(--ink);font-variant-numeric:tabular-nums}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:start;width:100%}
.lesson-row:hover{border-color:var(--accent)}
.lesson-row .t{flex:1;min-width:0}
.lesson-row b{display:block;font-size:19px}
.lesson-row small{color:var(--muted);font-size:15px}
.lesson-row .prev{font-family:var(--f-en);direction:ltr;color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.date-tag{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* lesson page */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:start;min-height:108px}
.act:hover{border-color:var(--accent)}
.act.main{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.act .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.act .ic svg{width:20px;height:20px}
.act b{font-size:18px}
.act small{color:var(--muted);font-size:15px;line-height:1.35}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.wl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--soft);text-align:start;border:0;width:100%}
.wl .en{font-size:20px;font-weight:700;flex:1;text-align:left}
.wl .he{color:var(--muted);font-size:16px}
.wl svg{width:18px;height:18px;color:var(--accent);flex:none}
.box-dots{display:inline-flex;gap:3px;direction:ltr}
.box-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--accent)}
.grammar{padding:16px 18px;border-radius:16px;background:var(--hint-bg);display:flex;flex-direction:column;gap:6px}
.grammar .ex{font-family:var(--f-en);direction:ltr;text-align:left;font-size:19px}

/* practice */
.play-head{display:flex;align-items:center;gap:12px}
.play-head .kind{font-size:15px;color:var(--muted);flex:1}
.say{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;padding:0;flex:none;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.say svg{width:28px;height:28px}
.say.slow{width:46px;height:46px;background:var(--surface);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.say.slow svg{width:22px;height:22px}
.task{font-size:21px;font-weight:500}
.prompt{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px}
.prompt .he-big{font-size:clamp(30px,5vw,40px);font-weight:600}
.answer-area{display:flex;flex-direction:column;align-items:center;gap:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:620px}
.opt{min-height:68px;padding:10px 16px;border-radius:16px;border:2.5px solid var(--line);background:var(--surface);font-size:22px;display:flex;align-items:center;gap:12px;text-align:start}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:15px;display:grid;place-items:center;flex:none;font-family:var(--f-body)}
.opt.en-opt{font-family:var(--f-en);font-weight:700;direction:ltr;text-align:left}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.picked{border-color:var(--muted);border-style:dashed}
.opt[disabled]{cursor:default}
.spell{width:min(100%,520px);font-family:var(--f-en);font-size:clamp(30px,6vw,44px);font-weight:700;text-align:center;direction:ltr;padding:6px 12px;border:0;border-bottom:3px solid var(--accent);background:transparent;border-radius:0;
  line-height:1.6}
.spell:focus-visible{outline:none;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.letters{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font-family:var(--f-en);font-weight:700;font-size:30px;direction:ltr}
.letters span{min-width:26px;text-align:center;border-bottom:3px solid var(--good)}
.letters span.miss{border-bottom-color:var(--margin);color:var(--margin)}
.sentence{font-family:var(--f-en);direction:ltr;text-align:center;font-size:clamp(24px,4vw,32px);line-height:1.6}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);margin-inline:.2em}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:ltr;min-height:64px;width:100%}
.tile{font-family:var(--f-en);font-weight:700;font-size:24px;min-height:54px;padding:4px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.tile:hover{border-color:var(--accent)}
.built{border-bottom:3px solid var(--accent);padding-bottom:10px}
.built:empty::before{content:"לחצי על המילים לפי הסדר";color:var(--muted);font-family:var(--f-body);font-size:17px;align-self:center}
.flash{width:min(100%,560px);min-height:230px;border-radius:20px;border:2.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.flash:hover{border-color:var(--accent)}
.flash .he-big{font-size:34px;font-weight:600}
.flash small{color:var(--muted);font-size:15px}
.feedback{width:100%;max-width:620px;border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;font-size:19px}
.feedback.good{background:var(--good-soft);color:var(--good);font-weight:600;flex-direction:row;align-items:center;gap:10px}
.feedback.good svg{width:24px;height:24px}
.feedback.next{background:var(--hint-bg)}
.feedback .en{font-weight:700;font-size:24px}
.progress{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:16px}
.bar{width:min(100%,360px);height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* story */
.story{font-family:var(--f-en);direction:ltr;text-align:left;font-size:clamp(21px,3vw,25px);line-height:1.9;max-width:34em}
.story mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 3px;cursor:pointer;border:0;font:inherit}
.gloss{min-height:32px;font-size:18px}
.gloss .en{font-weight:700}

/* finish */
.finish{align-items:center;text-align:center}
.stars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;color:var(--accent)}
.stars svg{width:30px;height:30px;fill:currentColor;stroke:none}
.review-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.review-list span{font-family:var(--f-en);font-weight:700;font-size:20px;padding:4px 14px;border-radius:999px;background:var(--hint-bg)}

/* parent */
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.p-card{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.p-card h3{display:flex;align-items:center;gap:10px}
.p-card .avatar{width:30px;height:30px;font-size:15px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.nums b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--muted)}
.hard{display:flex;flex-wrap:wrap;gap:6px}
.hard span{font-family:var(--f-en);font-weight:700;background:var(--hint-bg);border-radius:999px;padding:2px 10px;font-size:16px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-size:14px;color:var(--muted);font-weight:500}
td input{width:100%;min-width:90px;min-height:40px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
td input.en{font-size:18px}
td input.flag{border-color:var(--margin);background:var(--hint-bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:15px;color:var(--muted)}
.field input[type=text],.field textarea{min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:18px}
.field textarea{min-height:120px;resize:vertical}
.drop{border:2.5px dashed var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--soft)}
.drop.over{border-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-8px;inset-inline-end:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);padding:0;display:grid;place-items:center}
.thumbs button svg{width:14px;height:14px}
.kidpick{display:flex;gap:10px;flex-wrap:wrap}
.kidpick label{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);cursor:pointer}
.kidpick input{width:20px;height:20px;accent-color:var(--accent)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);background:var(--accent);box-shadow:0 0 0 2px var(--line);padding:0;display:grid;place-items:center;color:#fff}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw svg{width:18px;height:18px;stroke-width:3}
.notice{padding:12px 16px;border-radius:12px;background:var(--hint-bg);font-size:16px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:999px;font-size:16px;z-index:60;max-width:calc(100% - 32px)}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:28px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.modal input{min-height:52px;text-align:center;font-size:24px;border:2px solid var(--line);border-radius:12px;background:var(--surface);direction:ltr}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:20px;border-radius:16px;border:2px dashed var(--line)}
@media (max-width:520px){.opts{grid-template-columns:1fr}.lesson-row .prev{display:none}.sheet.paper{padding-inline-start:20px;background-image:none}}
</style>

<div class="wrap" id="app" aria-live="polite">
  <div class="sheet"><div class="row"><div class="spinner"></div><p class="lead">פותחת את המחברת…</p></div></div>
</div>

<style>
.act.main{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:96px;padding:18px 22px}
.act.main .ic{width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff}
.act.main .ic svg{width:28px;height:28px}
.act.main b{font-size:22px}
.or-pick{font-size:15px;color:var(--muted);grid-column:1/-1;margin-top:4px}
.acts .act:not(.main){min-height:auto;padding:12px 16px}
.say.slow{width:auto;height:46px;border-radius:999px;padding-inline:14px 16px;display:inline-flex;gap:6px;font-size:16px}
.pat{color:var(--accent);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.phon{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.phon-g{border-radius:14px;background:var(--soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.phon-g .pt{font-family:var(--f-en);font-weight:700;font-size:26px;color:var(--accent);direction:ltr;text-align:left}
.phon-g .ws{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.phon-g .ws button{font-family:var(--f-en);font-size:20px;font-weight:700;border:0;background:var(--surface);border-radius:10px;padding:2px 12px;min-height:40px}
.pairs{display:flex;flex-wrap:wrap;gap:10px;direction:ltr}

<script>
/* ---------- icons ---------- */
const I = {

  order:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="7" height="5" rx="1.5"/><rect x="14" y="5" width="7" height="5" rx="1.5"/><rect x="3" y="14" width="18" height="5" rx="1.5"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M4 5c3-1.5 5.5-1.5 8 0v15c-2.5-1.5-5-1.5-8 0z"/><path d="M12 5c2.5-1.5 5-1.5 8 0v15c-3-1.5-5.5-1.5-8 0"/></svg>',
  rule:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  ear:'<svg viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0"/><path d="M10 9a2 2 0 0 1 4 0"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  bulb:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>'
};
const COLORS = ['grape','sea','coral','leaf','rose','blue'];
const INTERVALS = [0,1,1,3,7,14]; // days until a word comes back, by box 1-5
const SESSION_SIZE = 8, NEW_PER_DAY = 4, AUTO_NEXT_MS = 1900;

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const fmtDay = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => fmtDay(new Date());
const addDays = (day,n) => { const d = new Date(day+'T12:00:00'); d.setDate(d.getDate()+n); return fmtDay(d); };
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const wkey = en => (String(en).trim().toLowerCase().replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,'_') || 'x').slice(0,80);
const norm = s => String(s||'').toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const heDate = day => { if(!day) return ''; const [y,m,d] = day.split('-'); return `${+d}.${+m}`; };
const plural = (n, one, many) => n===1 ? one : `${n} ${many}`;
const HEB = /[֐-׿]/;
// English runs inside Hebrew text are isolated, so they read left to right
const mixed = t => String(t ?? '').split(/([A-Za-z\/][A-Za-z0-9'’\/ ,.!?:\-]*[A-Za-z0-9.!?'’\/]|[A-Za-z])/).map((part,k)=> k%2 ? `<span class="en">${esc(part)}</span>` : esc(part)).join('');
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }

/* the letters of a phonics pattern inside a word, e.g. "u_e" in "cube" -> c[u]b[e] */
function patSpans(word, pattern){
  if(!pattern) return null;
  const w = word.toLowerCase();
  if(pattern.includes('_')){
    const [a,b] = pattern.split('_');
    for(let i=0;i<w.length;i++) if(w.startsWith(a,i) && w.startsWith(b, i+a.length+1)) return [[i,i+a.length],[i+a.length+1,i+a.length+1+b.length]];
    return null;
  }
  const i = w.indexOf(pattern); return i<0 ? null : [[i,i+pattern.length]];
}
function markPat(word, pattern){
  const sp = patSpans(word, pattern); if(!sp) return esc(word);
  let out='', last=0; for(const [a,b] of sp){ out += esc(word.slice(last,a)) + `<span class="pat">${esc(word.slice(a,b))}</span>`; last=b; }
  return out + esc(word.slice(last));
}

/* ---------- speech (English voice from the computer) ---------- */
let enVoice = null, lastUtter = null;
const badVoices = new Set();
const speechLog = {state:'', voice:'', error:''};
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); }catch(e){ return []; } }
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  // voices on the computer itself first: online voices (such as Google's) often stay silent inside an embedded page
  const score = v => (v.localService?20:0) + (/premium|enhanced/i.test(v.name)?10:0) + (/en[-_]US/i.test(v.lang)?3:0) + (/samantha|ava|allison|karen|daniel|zira|aria|jenny/i.test(v.name)?4:0);
  enVoice = enVoices().filter(v=>!badVoices.has(v.name)).sort((a,b)=>score(b)-score(a))[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
let speechWarned = false;
function speechTrouble(reason){
  speechLog.state = 'silent'; speechLog.error = reason;
  if(!speechWarned){ speechWarned = true; toast('ההקראה לא עובדת במכשיר הזה. אמא יכולה לבדוק באזור ההורים.'); }
  if(S.view==='parent') render();
}
function speak(text, slow, retry){
  if(!('speechSynthesis' in window) || !text) return;
  const ss = speechSynthesis;
  const fallback = why => {
    if(!retry && enVoice){ badVoices.add(enVoice.name); pickVoice(); speak(text, slow, true); }
    else speechTrouble(why);
  };
  const go = () => {
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = enVoice?.lang || 'en-US'; if(enVoice) u.voice = enVoice;
      u.rate = slow ? .55 : .85;
      let started = false;
      u.onstart = () => { started = true; speechLog.state='ok'; speechLog.voice = enVoice?.name || 'ברירת המחדל'; speechLog.error=''; if(S.view==='parent') render(); };
      u.onerror = e => { if(e.error==='interrupted' || e.error==='canceled') return; started = true; fallback(e.error||'error'); };
      lastUtter = u; // keep a reference: some browsers drop an utterance that nothing points to
      ss.resume();
      ss.speak(u);
      setTimeout(() => { if(!started && lastUtter===u && !ss.speaking) fallback('silent'); }, 2500);
    }catch(e){ speechTrouble(String(e.message||e)); }
  };
  // stopping and starting in the same moment loses the new sentence in Chrome, so wait a beat after a cancel
  if(ss.speaking || ss.pending){ ss.cancel(); setTimeout(go, 80); } else go();
}
const canSpeak = 'speechSynthesis' in window;
const sayBtns = txt => canSpeak ? `<button class="say" data-say="${esc(txt)}" aria-label="להשמיע">${I.speak}</button><button class="say slow" data-sayslow="${esc(txt)}">${I.slow}לאט</button>` : '';

/* ---------- four-line ruling measured from the real font ---------- */
function measureRuling(){
  try{
    const c = document.createElement('canvas').getContext('2d');
    c.font = '700 100px Andika';
    const m = c.measureText('Hxhg');
    const A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
    if(!A || !D) return;
    const xh = c.measureText('x').actualBoundingBoxAscent;
    const cap = c.measureText('H').actualBoundingBoxAscent;
    const desc = c.measureText('g').actualBoundingBoxDescent;
    const base = (190-(A+D))/2 + A;
    const r = document.documentElement.style;
    r.setProperty('--r-top', ((base-cap)/100).toFixed(3));
    r.setProperty('--r-x', ((base-xh)/100).toFixed(3));
    r.setProperty('--r-base', (base/100).toFixed(3));
    r.setProperty('--r-desc', ((base+desc)/100).toFixed(3));
  }catch(e){}
}
document.fonts?.load('700 40px Andika').then(measureRuling).catch(()=>{});

/* ---------- state ---------- */
const S = {
  family:null, lessons:[], progress:{},
  loaded:{family:false,lessons:false,progress:false},
  kidId:null, view:'loading', lessonId:null,
  session:null, story:{}, add:null, parentOk:false,
  sample:null, canImages:false, mode:'local', timer:null
};
const kid = () => S.family?.kids?.find(k=>k.id===S.kidId) || null;
const kidLessons = id => S.lessons.filter(l => (l.kids||[]).includes(id));
const prog = id => S.progress[id] || {words:{}, stars:0, streak:0, lastDay:''};
const lessonById = id => S.lessons.find(x=>x.id===id);

/* every practicable item of some lessons: vocabulary words and phonics words */
function entriesOf(lessons){
  const seen = new Map();
  for(const l of lessons){
    for(const w of (l.words||[])){ if(!w.en) continue; const key = wkey(w.en); if(!seen.has(key)) seen.set(key, {...w, key, lessonId:l.id}); }
    for(const g of (l.phonics||[])) for(const w of (g.words||[])){
      if(!w.en) continue; const key = 'ph_'+wkey(w.en);
      if(!seen.has(key)) seen.set(key, {...w, key, ph:true, pattern:g.pattern, lessonId:l.id});
    }
    for(const [a,b] of (l.pairs||[])) for(const [x,y] of [[a,b],[b,a]]){ const e = seen.get('ph_'+wkey(x)); if(e) e.pair = y; }
  }
  return [...seen.values()];
}
const kidEntries = id => entriesOf(kidLessons(id));
function sentencesOf(lessons){
  const out=[]; for(const l of lessons) for(const s of (l.sentences||[])){ const n = (s.en||'').trim().split(/\s+/).length; if(n>=3 && n<=10) out.push(s); }
  return out;
}

/* ---------- storage: shared db when available, the browser otherwise ---------- */
const LS = 'english-notebook-v1';
const Store = {
  db:null,
  async init(){
    const use = window.claude && window.claude.use ? (n)=>window.claude.use(n).catch(()=>null) : async()=>null;
    const [db, sample] = await Promise.all([use('db'), use('sample')]);
    S.sample = sample;
    if(sample){ try{ const lim = await sample.limits(); S.canImages = !!lim?.images; S.imgLimits = lim?.images||null; }catch(e){} }
    if(db){ this.db = db; S.mode='db'; this.subscribe(); }
    else { this.loadLocal(); }
  },
  loadLocal(){
    let d={}; try{ d = JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){}
    S.family = d.family||null; S.lessons = d.lessons||[]; S.progress = d.progress||{};
    S.loaded = {family:true,lessons:true,progress:true}; boot();
  },
  saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify({family:S.family,lessons:S.lessons,progress:S.progress})); }catch(e){} },
  subscribe(){
    const fail = e => { if(e?.code==='revoked') toast('אין כרגע גישה לנתונים'); };
    this.db.doc('config/family').onSnapshot(s => { S.family = s.exists ? s.data() : null; S.loaded.family=true; boot(); }, fail);
    this.db.collection('lessons').onSnapshot(q => { S.lessons = q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); S.loaded.lessons=true; boot(); }, fail);
    this.db.collection('progress').onSnapshot(q => { S.progress = Object.fromEntries(q.docs.map(d=>[d.id, d.data()])); S.loaded.progress=true; boot(); }, fail);
  },
  async write(fn, local){
    local();
    if(!this.db){ this.saveLocal(); return true; }
    try{ await fn(this.db); return true; }
    catch(e){
      if(e?.code==='unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await fn(this.db); return true; }catch(e2){} }
      toast(e?.code==='quota_exceeded' ? 'המחברת מלאה. אפשר למחוק שיעורים ישנים.' : 'השמירה לא הצליחה. כדאי לנסות שוב.');
      return false;
    }
  },
  saveFamily(f){ return this.write(db=>db.doc('config/family').set(f), ()=>{ S.family=f; }); },
  saveLesson(l){ const {id,...body}=l; return this.write(db=>db.collection('lessons').doc(id).set(body), ()=>{ const i=S.lessons.findIndex(x=>x.id===id); if(i>=0) S.lessons[i]=l; else S.lessons.unshift(l); }); },
  deleteLesson(id){ return this.write(db=>db.collection('lessons').doc(id).delete(), ()=>{ S.lessons=S.lessons.filter(x=>x.id!==id); }); },
  saveProgress(kidId,p){ return this.write(db=>db.doc('progress/'+kidId).set(p), ()=>{ S.progress[kidId]=p; }); }
};

/* ---------- routing ---------- */
const PASSIVE = new Set(['loading','home','kid','lesson','parent']);
function boot(){
  if(!(S.loaded.family && S.loaded.lessons && S.loaded.progress)) return;
  if(S.view==='loading'){
    let last=null; try{ last = localStorage.getItem(LS+':kid'); }catch(e){}
    if(!S.family?.kids?.length){ S.view='setup'; }
    else if(last && S.family.kids.some(k=>k.id===last)){ S.kidId=last; S.view='kid'; }
    else S.view='home';
    render(); return;
  }
  if(PASSIVE.has(S.view)) render();
}
function go(view, extra){ clearTimeout(S.timer); Object.assign(S, extra||{}, {view}); try{ speechSynthesis.cancel(); }catch(e){} render(); window.scrollTo(0,0); }
function render(){
  const k = kid();
  document.documentElement.className = 'c-' + (k?.color || 'grape');
  const v = ({home:vHome, setup:vSetup, kid:vKid, lesson:vLesson, play:vPlay, finish:vFinish, story:vStory, parent:vParent, add:vAdd})[S.view];
  app.innerHTML = (v ? v() : '');
  after[S.view]?.();
}
const after = {};

function topBar({back, backTo}={}){
  const k = kid();
  return `<div class="top">
    ${back ? `<button class="icon-btn" data-go="${backTo}" aria-label="חזרה">${I.back}</button>` : ''}
    <div class="logo"><span class="logo-mark" aria-hidden="true">Aa</span>מחברת אנגלית</div>
    ${k ? `<button class="chip" data-go="home" title="להחליף ילדה"><span class="avatar">${esc(k.name.slice(0,1))}</span>${esc(k.name)}</button>` : ''}
    <button class="icon-btn" data-act="parent" aria-label="אזור ההורים" title="אזור ההורים">${I.parent}</button>
  </div>`;
}

/* ---------- setup: names and colours ---------- */
function vSetup(){
  const kids = S.setupKids || (S.family?.kids?.length ? S.family.kids.map(k=>({...k})) : [{id:uid(),name:'',color:'grape'},{id:uid(),name:'',color:'sea'}]);
  S.setupKids = kids;
  return `${topBar({back:!!S.family?.kids?.length, backTo:'parent'})}
  <div class="sheet paper">
    <h1>מי לומדת כאן?</h1>
    <p class="lead">כתבי את השמות של הבנות ובחרי צבע לכל אחת. אפשר לשנות אחר כך.</p>
    ${kids.map((k,i)=>`<div class="stack c-${k.color}" style="padding:14px;border-radius:16px;background:var(--soft)">
      <div class="field"><label for="kn${i}">שם</label><input type="text" id="kn${i}" data-kn="${i}" value="${esc(k.name)}" placeholder="השם שלה" autocomplete="off"></div>
      <div class="lbl">הצבע שלה</div>
      <div class="sws">${COLORS.map(c=>`<button class="sw c-${c}" data-kc="${i}" data-c="${c}" aria-pressed="${k.color===c}" aria-label="${c}">${k.color===c?I.check:''}</button>`).join('')}</div>
      ${kids.length>1?`<button class="link" data-krm="${i}" style="align-self:flex-start">להסיר</button>`:''}
    </div>`).join('')}
    <div class="row">
      ${kids.length<4?`<button class="btn" data-act="kadd">${I.plus} עוד ילדה</button>`:''}
      <button class="btn primary" data-act="ksave">${I.save} שמירה</button>
    </div>
  </div>`;
}

/* ---------- home: choose who is learning (no numbers here, so the sisters aren't compared) ---------- */
function vHome(){
  const kids = S.family?.kids || [];
  return `${topBar()}
  <div class="sheet paper">
    <h1>מי לומדת עכשיו?</h1>
    <div class="kids">${kids.map(k=>`<button class="kid-card c-${k.color}" data-kid="${k.id}"><span class="avatar">${esc(k.name.slice(0,1))}</span><span><b>${esc(k.name)}</b><span>המחברת של ${esc(k.name)}</span></span></button>`).join('')}</div>
  </div>`;
}

/* ---------- spaced repetition: what is waiting today ---------- */
function dueEntries(kidId){
  const p = prog(kidId), t = today(), all = kidEntries(kidId);
  const st = e => p.words?.[e.key];
  const due = all.filter(e => st(e) && (st(e).due||'') <= t).sort((a,b)=>(st(a).b||0)-(st(b).b||0));
  const fresh = all.filter(e => !st(e));
  return due.concat(fresh.slice(0, NEW_PER_DAY)).slice(0, SESSION_SIZE);
}
function vKid(){
  const k = kid(); if(!k) return vHome();
  const ls = kidLessons(k.id), p = prog(k.id), due = dueEntries(k.id), all = kidEntries(k.id);
  const known = all.filter(w => (p.words?.[w.key]?.b||0) >= 4).length;
  return `${topBar()}
  <div class="sheet paper">
    <div class="row"><h1 style="margin-inline-end:auto">שלום ${esc(k.name)}</h1>
      <div class="mykid"><span>הצבע שלי</span><div class="sws">${COLORS.map(c=>`<button class="sw c-${c}" data-mycolor="${c}" aria-pressed="${k.color===c}" aria-label="${c}">${k.color===c?I.check:''}</button>`).join('')}</div></div></div>
    ${ls.length ? `
    <div class="today">
      <div class="txt">

/* ---------- building a practice session ---------- */
const fillPatterns = () => [...new Set(kidEntries(kid().id).filter(x=>x.ph && !x.pattern.includes('_')).map(x=>x.pattern))];
const withExample = w => !w.ph && w.example && new RegExp('\\b'+reEsc(w.en)+'\\b','i').test(w.example);
function typeFor(e, b, vocabCount){
  if(e.ph){
    const canFill = !e.pattern?.includes('_') && patSpans(e.en, e.pattern) && fillPatterns().length>=2;
    if(b<2) return pick(canSpeak ? ['read','hear'] : ['read']);
    return pick(['read', canSpeak?'hear':'read', canFill?'phfill':'read']);
  }
  if(vocabCount<4) return 'flash';
  if(b<2) return pick(['choose','rev'].concat(canSpeak?['listen']:[]));
  const hard = (canSpeak?['spell']:[]).concat(withExample(e)?['blank']:[]);
  return hard.length ? pick(hard) : 'rev';
}
function buildItems(mode, lessons, entries){
  const k = kid(), p = prog(k.id);
  const vocabCount = kidEntries(k.id).filter(e=>!e.ph).length;
  const box = e => p.words?.[e.key]?.b || 0;
  const sents = shuffle(sentencesOf(lessons));
  const vocab = entries.filter(e=>!e.ph), phon = entries.filter(e=>e.ph);
  if(mode==='flash') return shuffle(vocab).map(w=>({type:'flash', w}));
  if(mode==='spell') return shuffle(vocab.filter(e=>box(e)>=2)).slice(0,SESSION_SIZE).map(w=>({type:'spell', w}));
  if(mode==='order') return sents.slice(0,6).map(s=>({type:'order', s}));
  // a lesson round: words she already met first, then at most a few new ones, so a round stays short
  const limitNew = list => { const met = shuffle(list.filter(e=>p.words?.[e.key])), fresh = shuffle(list.filter(e=>!p.words?.[e.key])).slice(0, NEW_PER_DAY+1); return shuffle(met.slice(0, SESSION_SIZE-fresh.length).concat(fresh)); };
  let pool = mode==='daily' ? entries : limitNew(mode==='phonics' ? phon : entries);
  // a word met for the first time gets an introduction card; the question on it comes a little later
  const items = [], later = [];
  for(const e of pool){
    if(!p.words?.[e.key]){ items.push({type:'intro', w:e}); later.push({type:typeFor(e,0,vocabCount), w:e}); }
    else items.push({type:typeFor(e, box(e), vocabCount), w:e});
    if(later.length && items.length>=2 && items[items.length-1].type!=='intro') items.push(later.shift());
  }
  items.push(...later);
  if(mode!=='phonics' && sents.length) items.splice(Math.min(items.length,5), 0, {type:'order', s:sents[0]});
  return items;
}
function startSession(mode, opts={}){
  const k = kid(); if(!k) return;
  let lessons, entries;
  if(mode==='daily'){ lessons = kidLessons(k.id); entries = dueEntries(k.id); }
  else { const l = lessonById(S.lessonId); lessons=[l]; entries = entriesOf([l]); }
  const items = opts.items || buildItems(mode, lessons, entries);
  if(!items.length){
    toast(mode==='spell' ? 'קודם נכיר את המילים בתרגול המעורב, ואחר כך נכתוב אותן.' : 'אין כאן עדיין מה לתרגל');
    return;
  }
  S.session = { mode, items, i:0, base: items.filter(x=>x.type!=='explain').length, right:0, firstTry:0, done:0,
    review:new Set(), fixed:new Set(), requeued:new Set(), prog: structuredClone(prog(k.id)), answered:false,
    back: opts.back || (mode==='daily'?'kid':'lesson'), quiz:!!opts.quiz, token: uid() };
  S.session.prog.words = S.session.prog.words || {};
  go('play');
}
function grade(item, ok, {hinted}={}){
  const s = S.session; if(s.answered) return; s.answered = true; s.done++;
  if(item.w){
    const key = item.w.key || wkey(item.w.en), t = today();
    const st = {...(s.prog.words[key] || {b:0, r:0, w:0})};
    if(ok){
      st.r = (st.r||0)+1;
      // a box goes up at most once a day, and not on the second chance at the end of a round
      if(!hinted && !item.again && st.up !== t){ st.b = Math.min((st.b||0)+1, 5); st.up = t; st.due = addDays(t, INTERVALS[st.b]); }
      else if(!st.due || st.due <= t) st.due = addDays(t, 1);
      if(item.again) s.fixed.add(item.w.en);
    } else {
      st.w = (st.w||0)+1; st.b = (st.b||0)>=3 ? 2 : 1; st.due = addDays(t, 1);
      s.review.add(item.w.en); s.fixed.delete(item.w.en);
    }
    st.last = t;
    s.prog.words[key] = st;
    if(!ok && !s.requeued.has(key)){
      s.requeued.add(key);
      const easy = item.w.ph ? (canSpeak?'hear':'read') : s.mode==='flash' ? 'flash' : (canSpeak?'listen':'choose');
      s.items.push({type: easy, w:item.w, again:true});
      item.willReturn = true;
    }
  }
  if(ok){ s.right++; if(!hinted) s.firstTry++; }
}
function nextItem(){
  clearTimeout(S.timer);
  const s = S.session; s.i++; s.answered=false;
  if(s.i >= s.items.length) return finishSession(true);
  render(); window.scrollTo(0,0);
}
async function finishSession(complete){
  clearTimeout(S.timer);
  const s = S.session, k = kid();
  s.complete = complete;
  if(!s.done){ go(s.back); return; }
  const p = s.prog, t = today();
  p.stars = (p.stars||0) + s.firstTry;
  if(p.lastDay !== t){ p.streak = (p.lastDay === addDays(t,-1)) ? (p.streak||0)+1 : 1; p.lastDay = t; }
  go('finish');
  await Store.saveProgress(k.id, p);
}

/* ---------- practice screens ---------- */
function optionsFor(w, field, {differentPos}={}){
  const k = kid();
  let pool = kidEntries(k.id).filter(x=>!x.ph && x.key!==w.key && x[field] && norm(x[field])!==norm(w[field]));
  // in a gap sentence another word of the same kind could also fit, so prefer a different kind of word
  if(differentPos && w.pos && w.pos!=='op'){ const other = pool.filter(x=>x.pos && x.pos!==w.pos); if(other.length>=3) pool = other; }
  return shuffle([w[field], ...shuffle(pool).slice(0,3).map(x=>x[field])]);
}
function phOptions(w){
  const k = kid();
  if(w.pair) return shuffle([w.en, w.pair]);
  const pool = kidEntries(k.id).filter(x=>x.ph && x.key!==w.key && x.pattern!==w.pattern);
  return shuffle([w.en, ...shuffle(pool).slice(0,2).map(x=>x.en)]);
}
const optBtns = (opts, en) => `<div class="opts">${opts.map((o,i)=>`<button class="opt ${en?'en-opt':''}" data-opt="${i}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('')}</div>`;
function vPlay(){

      <div class="prompt"><div class="row">${sayBtns(it.w.en)}</div></div>

  } else if(it.type==='read'){

          : `<button class="btn primary" data-act="readcheck">${I.speak} קראתי, להקשיב</button>`}
      </div><div id="fb"></div></div>`;
  } else if(it.type==='phfill'){
    const [[a,b]] = patSpans(it.w.en, it.w.pattern);
    it.opts = it.opts || shuffle([it.w.pattern, ...shuffle([...new Set(kidEntries(kid().id).filter(x=>x.ph && !x.pattern.includes('_') && x.pattern!==it.w.pattern).map(x=>x.pattern))]).slice(0,2)]);
    body = `<p class="task">אילו אותיות חסרות?</p>

        <div class="ctrl">${it.flipped?`<button class="btn primary" data-act="knew" id="knewBtn">ידעתי</button><button class="btn" data-act="notyet">עוד לא, שתחזור אליי</button>`:''}${canSpeak?`<button class="btn" data-say="${esc(it.w.en)}">${I.speak} להשמיע</button>`:''}</div>
      </div>`;
  } else if(it.type==='explain'){
    body = `<p class="task">לפני השאלות: הכלל</p>

      <div class="ctrl"><button class="btn primary" data-act="next" id="nextBtn">לשאלה הראשונה</button></div></div>`;
  } else if(it.type==='mcq'){

}

/* spelling: line the two words up, so a missing letter is shown as one missing letter */
function alignWords(typed, target){
  const a = typed.toLowerCase(), b = target.toLowerCase(), n=a.length, m=b.length;
  const L = Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j] = a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const hit = new Array(m).fill(false); let i=0,j=0;
  while(i<n && j<m){ if(a[i]===b[j]){ hit[j]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return hit;
}
function spellTip(typed, target, hit){
  const t = target.toLowerCase(), miss = [...t].map((c,i)=>hit[i]?null:{c,i}).filter(Boolean);
  if(!miss.length) return '';
  for(const {c,i} of miss) if((t[i-1]===c || t[i+1]===c) && /[a-z]/.test(c)) return `במילה הזאת יש שתי <span class="en">${c}</span> צמודות.`;
  if(t.endsWith('e') && miss.some(x=>x.i===t.length-1)) return `בסוף המילה יש <span class="en">e</span> שלא שומעים.`;
  if(miss.every(x=>'aeiouy'.includes(x.c))) return 'באנגלית כותבים גם את התנועות.';
  if(/^(kn|wr)/.test(t) && miss.some(x=>x.i===0)) return `את האות הראשונה כותבים, אבל לא שומעים.`;
  if(t.includes('th') && miss.some(x=>t.slice(x.i-1,x.i+1)==='th'||t.slice(x.i,x.i+2)==='th')) return `את הצליל הזה כותבים בשתי אותיות: <span class="en">th</span>.`;
  return '';
}
function checkSpell(){
  const s = S.session, it = s.items[s.i];
  const inp = document.getElementById('spell'); const val = inp.value;
  if(!val.trim()){ inp.focus(); return; }
  if(HEB.test(val)){ toast('המקלדת בעברית. צריך להחליף לאנגלית.'); inp.select(); return; }
  const target = it.w.en, typed = val.trim().replace(/\s+/g,' ');
  if(it.retry){
    // the second try after a mistake: practice only, the box was already set
    if(norm(typed)===norm(target)){ inp.disabled=true; speak(target); showFeedback(true, `עכשיו כתבת <span class="en">${esc(target)}</span>`, true); }
    else { inp.value=''; inp.focus(); toast('הסתכלי שוב על המילה ונסי עוד פעם'); }
    return;
  }
  if(s.answered) return;
  const sameLetters = typed.toLowerCase().replace(/[^a-z' ]/g,'') === target.toLowerCase().replace(/[^a-z' ]/g,'');
  if(sameLetters){
    grade(it, true, {hinted: it.hinted});
    inp.disabled = true; speak(target);
    const capNote = typed !== target && /[A-Z]/.test(target) && typed.replace(/[^A-Za-z]/g,'') !== target.replace(/[^A-Za-z]/g,'')
      ? ` כמעט מושלם: <span class="en">${esc(target)}</span> כותבים באות גדולה.` : '';
    showFeedback(true, (it.hinted ? `השלמת את המילה: <span class="en">${esc(target)}</span>` : `כתבת נכון: <span class="en">${esc(target)}</span>`) + capNote, !capNote);
    return;
  }
  grade(it, false);
  const hit = alignWords(typed, target);
  const letters = [...target].map((ch,i)=>`<span class="${hit[i]?'':'miss'}">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('');
  const tip = spellTip(typed, target, hit);
  it.retry = true;
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="feedback next"><span>ככה כותבים את המילה.</span><div class="letters">${letters}</div>
    <span>${tip || 'שימי לב לאותיות בוורוד.'}</span><span class="mine">מה שכתבת: <span class="en">${esc(typed)}</span></span></div>
    <div class="retry"><span>עכשיו כתבי אותה בעצמך</span></div>`;
  inp.value=''; inp.focus();
  const ctrl = document.querySelector('.answer-area .ctrl');
  if(ctrl) ctrl.innerHTML = `<button class="btn primary" data-act="check">לבדוק</button><button class="btn" data-act="next" id="nextBtn">${nextLabel()}</button>`;
}
function giveHint(){
  const it = S.session.items[S.session.i]; const inp = document.getElementById('spell'); if(!inp||S.session.answered) return;
  const target = it.w.en; let i=0; const v = inp.value;
  while(i<v.length && i<target.length && v[i].toLowerCase()===target[i].toLowerCase()) i++;
  inp.value = target.slice(0, Math.min(i+1, target.length)); it.hinted = true; inp.focus();
}
function checkOrder(){
  const s = S.session, it = s.items[s.i]; if(s.answered) return;
  const built = it.built.map(j=>it.tiles[j].t).join(' ');
  const ok = norm(built) === norm(it.s.en);
  s.answered = true; s.done++; if(ok){ s.right++; s.firstTry++; }
  document.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(canSpeak) speak(it.s.en);
  if(ok) showFeedback(true, `בנית את המשפט: <span class="en">${esc(it.s.en)}</span>`, false);
  else showFeedback(false, `<span>הקשיבי למשפט:</span><span class="en" style="font-size:22px">${esc(it.s.en)}</span><span class="mine">הסידור שלך: <span class="en">${esc(built)}</span></span>`);
}

function quizItems(l, qs){
  const items = (l.grammar||[]).length ? [{type:'explain', grammar:l.grammar}] : [];
  for(const q of qs){
    const order = shuffle(q.options.map((o,i)=>i));
    items.push({type:'mcq', q:{...q, options: order.map(i=>q.options[i]), answer: order.indexOf(q.answer)}});
  }
  return items;
}

}

async function shrink(file){
  // phone photos are large: scale to 1600px so they fit the upload limit and read well
  const bmp = await createImageBitmap(file).catch(()=>null); if(!bmp) return file;
  const s = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
  const c = document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85));
}
async function addImages(list){
  syncAddInputs();
  const max = S.imgLimits?.maxCount || 5;
  for(const f of [...list]){
    if(!f.type.startsWith('image/')) continue;
    if(S.add.images.length>=max){ toast(`אפשר עד ${max} תמונות`); break; }
    const blob = await shrink(f);
    S.add.images.push({blob, url:URL.createObjectURL(blob)});
  }
  render();
}
function syncAddInputs(){
  const a = S.add; if(!a) return;

  const ti = document.getElementById('atitle'); if(ti) a.title = ti.value;
  const d = document.getElementById('adate'); if(d) a.date = d.value;
  const hw = document.getElementById('ahw'); if(hw) a.homework = hw.value;
  document.querySelectorAll('[data-w]').forEach(i=>{ const w=a.words[+i.dataset.w]; if(w && w[i.dataset.f]!==i.value){ w[i.dataset.f]=i.value; if(i.dataset.f==='en') delete w.unsure; } });
  document.querySelectorAll('[data-s]').forEach(i=>{ const s=a.sentences[+i.dataset.s]; if(s) s[i.dataset.f]=i.value; });
  const boxes = document.querySelectorAll('[data-akid]'); if(boxes.length) a.kids = [...boxes].filter(c=>c.checked).map(c=>c.dataset.akid);

async function extract(){
  syncAddInputs();
  const a = S.add;
  if(!a.images.length && !a.text.trim()){ toast('צריך תמונה או טקסט של ההערות'); return; }
  a.step='extracting'; render();
  const prompt = `You help an Israeli parent turn an English teacher's lesson notes into practice material for her daughters, aged 8 and 9, who are beginner English learners and native Hebrew speakers. The notes are often a long, friendly message: ignore the praise and keep only what was taught.
${a.images.length?`The ${a.images.length} attached image(s) are the teacher's notes (a message, handwriting, a notebook, a whiteboard or a worksheet). They may mix Hebrew and English.`:''}
${a.text.trim()?`Notes pasted by the parent:\n"""${a.text.trim()}"""`:''}
Extract only what is actually in the notes. Do not add vocabulary the teacher did not teach.
- title: a short Hebrew title for the lesson topic (2-4 words).
- words: vocabulary items to learn by meaning. "en" exactly as taught (lowercase unless a proper noun or "I"). Keep multi-word phrases as ONE item exactly as written (e.g. "brush my teeth", "far from"); never split a phrase. Function words (a, an, the, am, is, are, he, she) belong in grammar, not in words, unless the teacher listed them as vocabulary. "he": the Hebrew meaning (the teacher's if written, else the most natural one for a child, 1-3 words, no parentheses). "pos": noun / verb / adjective / phrase / other. "example": one short simple English sentence of up to 8 words that contains "en" exactly as written, and gives a clue that fits ONLY this word and none of the other words in the list (e.g. "A banana is long and yellow.", not "I like bananas."); use the teacher's sentence if it works. "exampleGenerated": true if you wrote the example. "unsure": true only if you could not read the word clearly.
- phonics: if the notes teach letter sounds, spelling patterns or word families (e.g. "or", "ur", "air", magic e "u_e", short "u"), list each pattern with its example words: [{"pattern":"ur","words":[{"en":"nurse","he":"אחות"}]}]. Write a split pattern with an underscore ("u_e"). Words of a phonics list go here, not in words.
- pairs: word pairs the teacher contrasts (e.g. [["cub","cube"],["tub","tube"]]), else [].
- tip: if there is phonics, one short Hebrew sentence for a child explaining the sound rule, else "".
- sentences: up to 8 complete English sentences from the notes worth practising (3-10 words each), with "he" translation. If there are fewer than 3, add simple ones that use the taught words and grammar and mark them "generated": true.
- grammar: grammar points taught. "title" a short Hebrew title, "explain" 1-2 very short Hebrew sentences for an 8-year-old, up to 10 words each, feminine singular, showing the rule through an English example in English letters rather than grammar terms; no "פשוט" or "קל", no parentheses. "examples": 2-3 English examples (the teacher's if given).
- quiz: if there is grammar, 6 questions on it. ${QUIZ_RULES}
- homework: any instruction, page number or due date in the notes, in Hebrew, else "".
Reply with JSON only: {"title":"","words":[{"en":"","he":"","pos":"","example":"","exampleGenerated":false,"unsure":false}],"phonics":[],"pairs":[],"tip":"","sentences":[{"en":"","he":"","generated":false}],"grammar":[{"title":"","explain":"","examples":[""]}],"quiz":[{"prompt":"","q":"","options":["",""],"answer":0,"explain":""}],"homework":""}`;
  try{
    const opts = {modelTier:'complex', cache:false};
    if(a.images.length) opts.images = a.images.map(i=>i.blob);
    const r = await S.sample.json(prompt, opts);
    a.title = a.title || r.title || '';
    a.words = (r.words||[]).filter(w=>w.en).map(w=>({en:String(w.en).trim(), he:w.he||'', pos:w.pos||'', example:w.example||'', ...(w.exampleGenerated?{exampleGenerated:true}:{}), ...(w.unsure?{unsure:true}:{})}));
    a.phonics = (r.phonics||[]).filter(g=>g.pattern && (g.words||[]).length).map(g=>({pattern:String(g.pattern).toLowerCase(), words:g.words.filter(w=>w.en).map(w=>({en:String(w.en).trim(), he:w.he||''}))}));
    a.pairs = (r.pairs||[]).filter(p=>Array.isArray(p) && p.length===2);
    a.tip = r.tip||'';
    a.sentences = (r.sentences||[]).filter(s=>s.en).map(s=>({en:s.en, he:s.he||'', ...(s.generated?{generated:true}:{})}));
    a.grammar = (r.grammar||[]).filter(g=>g.title);
    a.quiz = (r.quiz||[]).filter(q=>Array.isArray(q.options) && q.options[q.answer]!=null);
    a.homework = r.homework||'';
    if(!a.words.length && !a.phonics.length) toast('לא נמצאו מילים. אפשר להוסיף ידנית.');
    a.step='review';
  }catch(e){
    a.step='input';
    toast(e?.code==='rate_limited'?'יש עומס. כדאי לנסות שוב בעוד דקה.':e?.code==='not_granted'?'צריך לאשר ל-Claude לעזור בדף הזה.':e?.code==='image_rejected'?'אחת התמונות לא נקראה. כדאי לצלם שוב.':'Claude לא הצליח לקרוא את ההערות. אפשר לנסות שוב או להזין ידנית.');
  }
  render();
}
function manual(){
  syncAddInputs(); const a = S.add;
  const lines = a.text.split(/\n|,(?=\s*[a-zA-Z])/).map(s=>s.trim()).filter(Boolean);
  for(const ln of lines){
    const m = ln.match(/^([a-zA-Z][a-zA-Z' \-]*?)\s*[-–=:]\s*(.+)$/) || ln.match(/^(.+?)\s*[-–=:]\s*([a-zA-Z][a-zA-Z' \-]*)$/);
    if(m){ const [x,y]=[m[1].trim(),m[2].trim()]; const enFirst=/^[a-zA-Z]/.test(x); a.words.push({en:enFirst?x:y, he:enFirst?y:x, example:''}); }
    else if(/^[a-zA-Z]/.test(ln)) a.words.push({en:ln, he:'', example:''});
  }
  if(!a.words.length) a.words.push({en:'',he:'',example:''});
  a.step='review'; render();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-act]'); if(!t) return;
  if(t.classList.contains('scrim') && e.target!==t) return;
  const d = t.dataset;
  if(d.say!==undefined){ speak(d.say); return; }
  if(d.sayslow!==undefined){ speak(d.sayslow, true); return; }
  if(d.gl){ showGloss(t); return; }
  if(d.go){ if(d.go==='home') S.kidId=null; go(d.go); return; }
  if(d.kid){ S.kidId=d.kid; try{ localStorage.setItem(LS+':kid', d.kid); }catch(_){} go('kid'); return; }
  if(d.lesson){ S.lessonId=d.lesson; go('lesson'); return; }
  if(d.mycolor){ const f = structuredClone(S.family); const k = f.kids.find(x=>x.id===S.kidId); if(k && k.color!==d.mycolor){ k.color=d.mycolor; await Store.saveFamily(f); render(); } return; }
  if(d.play){
    if(d.play==='story'){ go('story'); if(!S.story[S.lessonId] || S.story[S.lessonId].error) makeStory(); return; }
    if(d.play==='grammar'){ makeGrammar(); return; }
    startSession(d.play); return;
  }
  if(d.sq){ const [qi,oi] = d.sq.split(':').map(Number); const st = S.story[S.lessonId]; if(st.ans[qi]==null){ st.ans[qi]=oi; render(); } return; }
  if(d.opt!==undefined){ answerOption(+d.opt); return; }
  if(d.tile!==undefined){ const it=S.session.items[S.session.i]; if(!S.session.answered){ it.built.push(+d.tile); render(); } return; }
  if(d.unb!==undefined){ const it=S.session.items[S.session.i]; if(!S.session.answered){ it.built.splice(+d.unb,1); render(); } return; }
  if(d.kc!==undefined){ syncSetup(); S.setupKids[+d.kc].color=d.c; render(); return; }
  if(d.krm!==undefined){ syncSetup(); S.setupKids.splice(+d.krm,1); render(); return; }
  if(d.rmimg!==undefined){ syncAddInputs(); S.add.images.splice(+d.rmimg,1); render(); return; }
  if(d.rmw!==undefined){ syncAddInputs(); S.add.words.splice(+d.rmw,1); render(); return; }
  if(d.rms!==undefined){ syncAddInputs(); S.add.sentences.splice(+d.rms,1); render(); return; }
  if(d.rmg!==undefined){ syncAddInputs(); S.add.grammar.splice(+d.rmg,1); render(); return; }
  if(d.rmq!==undefined){ syncAddInputs(); S.add.quiz.splice(+d.rmq,1); render(); return; }
  if(d.rmph!==undefined){ syncAddInputs(); S.add.phonics.splice(+d.rmph,1); render(); return; }
  if(d.edit){ S.add = newAdd(lessonById(d.edit)); go('add'); return; }
  if(d.del){
    if(t.dataset.armed){ await Store.deleteLesson(d.del); toast('השיעור נמחק'); render(); }
    else { t.dataset.armed='1'; t.innerHTML='<span style="font-size:13px">למחוק?</span>'; t.style.width='auto'; t.style.paddingInline='10px'; setTimeout(()=>{ if(t.isConnected && S.view==='parent') render(); },3000); }
    return;
  }
  const act = d.act; if(!act) return;
  const s = S.session, it = s?.items?.[s.i];
  switch(act){
    case 'daily': startSession('daily'); break;
    case 'parent': if(S.parentOk) go('parent'); else gate(); break;
    case 'gateok': { const v = +document.getElementById('gate').value; if(v===S.gateAns){ S.parentOk=true; document.querySelector('.scrim')?.remove(); go(S.family?.kids?.length?'parent':'setup'); } else { gate(); toast('זה לא המספר. הנה תרגיל אחר.'); } break; }
    case 'gateno': document.querySelector('.scrim')?.remove(); break;
    case 'kadd': syncSetup(); S.setupKids.push({id:uid(), name:'', color:COLORS.find(c=>!S.setupKids.some(k=>k.color===c))||'grape'}); render(); break;
    case 'ksave': {
      syncSetup(); const kids = S.setupKids.filter(k=>k.name.trim()).map(k=>({id:k.id,name:k.name.trim(),color:k.color}));
      if(!kids.length){ toast('צריך לפחות שם אחד'); break; }
      if(await Store.saveFamily({kids})){ S.setupKids=null; if(!kids.some(k=>k.id===S.kidId)) S.kidId=null; go(S.parentOk?'parent':'home'); }
      break; }
    case 'editkids': S.setupKids=null; go('setup'); break;
    case 'addlesson': S.add = newAdd(); go('add'); break;
    case 'extract': extract(); break;
    case 'manual': manual(); break;
    case 'addw': syncAddInputs(); S.add.words.push({en:'',he:'',example:''}); render(); break;
    case 'adds': syncAddInputs(); S.add.sentences.push({en:'',he:''}); render(); break;
    case 'savelesson': saveLesson(); break;
    case 'quit': if(s && s.done>0) finishSession(false); else go(s?.back||'kid'); break;
    case 'next': if(it && it.type==='intro'){ markSeen(it.w); } if(it && it.type==='spell' && !s.answered) grade(it,false); nextItem(); break;
    case 'check': checkSpell(); break;
    case 'hint': giveHint(); break;
    case 'checkorder': checkOrder(); break;
    case 'flip': it.flipped=true; render(); if(canSpeak) speak(it.w.en); break;
    case 'knew': grade(it,true); nextItem(); break;
    case 'notyet': grade(it,false); nextItem(); break;
    case 'readcheck': it.heard=true; speak(it.w.en); render(); break;
    case 'readok': grade(it,true); nextItem(); break;
    case 'readno': grade(it,false); nextItem(); break;
    case 'newstory': makeStory(true); break;
  }
});
function markSeen(w){
  const s = S.session; if(s.prog.words[w.key]) return;
  s.prog.words[w.key] = {b:0, r:0, w:0, due: today(), last: today()};
  s.done++;
}
function syncSetup(){ document.querySelectorAll('[data-kn]').forEach(i=>{ S.setupKids[+i.dataset.kn].name=i.value; }); }
document.addEventListener('keydown', e => {
  if(document.querySelector('.scrim')){
    if(e.key==='Escape') document.querySelector('.scrim')?.remove();
    if(e.key==='Enter' && e.target.id==='gate') document.querySelector('[data-act="gateok"]')?.click();
    return;
  }
  if(S.view!=='play') return;
  const s = S.session, it = s.items[s.i];
  if(e.key==='Enter'){
    if(e.target.tagName==='BUTTON') return; // a focused button handles Enter itself
    if(it.type==='spell' && e.target.id==='spell'){ e.preventDefault(); checkSpell(); return; }
    if(s.answered){ e.preventDefault(); document.getElementById('nextBtn')?.click(); return; }
    if(it.type==='order' && it.built.length===it.tiles.length){ e.preventDefault(); checkOrder(); }
    return;
  }
  if(s.answered || !/^[1-4]$/.test(e.key) || e.target.tagName==='INPUT') return;
  const opts = it.type==='mcq' ? it.q.options : it.opts;
  if(opts && +e.key-1 < opts.length) answerOption(+e.key-1);
});

Store.init();
</script>
