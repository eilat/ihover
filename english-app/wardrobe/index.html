<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ארון הבגדים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@400;500;600&family=Andika:wght@400;700&family=Henny+Penny&display=swap">
<style>
/* VOICE a children's dress-up toy, playful and a little spooky like the drawings it comes from
   PICTURE the attic: the character stands on the rug, the clothes wait on the wardrobe shelves
   COLOUR parchment ground, ink outline, wine and violet, gold for stars
   TYPE Karantina for Hebrew titles, Henny Penny for names, Andika for the English words, Rubik for text
   ART every layer is a transparent 1000x2000 PNG (here 500x1000 webp) drawn for the same body, stacked in a fixed order */
:root{color-scheme:light;--bg:#E9D6AE;--paper:#F4E7C8;--ink:#2B1D2E;--muted:#6B5648;--wine:#8C3550;--violet:#4B3150;--gold:#E6B53A;--line:#C9AE7F}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Rubik",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.band{padding-block:clamp(16px,2.5vw,32px);padding-inline:max(3vw,14px)}
.wrap{max-width:1280px;margin-inline:auto}
h1{font-family:"Karantina",system-ui,sans-serif;font-weight:700;line-height:1;margin:0;font-size:clamp(40px,5vw,58px)}
.top{display:flex;gap:10px 24px;align-items:end;justify-content:space-between;flex-wrap:wrap}
.lead{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* the four girls to choose from */
.heads{display:flex;gap:10px;flex-wrap:wrap}
.head{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0}
.head .ring{width:60px;height:60px;border-radius:50%;border:3px solid var(--line);background:var(--paper);overflow:hidden;position:relative}
.head .ring img{position:absolute;width:250%;left:-75%;top:-8%;max-width:none}
.head b{font-family:"Henny Penny",serif;font-weight:400;font-size:15px;direction:ltr}
.head[aria-pressed="true"] .ring{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold)}

/* a figure is a stack of same-size layers */
.fig{position:relative;aspect-ratio:1/2;height:100%}
.fig img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.fig img.pop{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;translate:0 -3%}}

.scene{position:relative;aspect-ratio:1672/941;margin-top:14px;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:#6A3D63 url("attic.webp") center/cover no-repeat}
.scene .me{position:absolute;left:14%;width:30%;top:3%;bottom:3%;display:flex;justify-content:center}
.scene .me .fig{filter:drop-shadow(0 10px 6px rgba(20,10,25,.35))}
.say{position:absolute;left:1%;width:44%;top:2%;margin:0;min-height:1.4em;font-family:"Andika",sans-serif;font-weight:700;direction:ltr;text-align:center;color:#fff;text-shadow:0 2px 0 #2B1D2E,0 0 10px #2B1D2E;font-size:clamp(18px,2.4vw,30px);pointer-events:none}

/* the wardrobe: tabs on the top shelf, items on the shelves below */
.shelves{position:absolute;left:47.6%;right:16.6%;top:26%;bottom:17.5%;display:flex;flex-direction:column;gap:1%;padding:.6%}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{min-height:34px;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);background:rgba(244,231,200,.92);font-weight:500;font-size:clamp(12px,1.05vw,15px)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.items{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(84px,9vw,124px),1fr));align-content:start;gap:6px;padding:2px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;padding:6px 4px 4px;border-radius:14px;border:2.5px solid var(--line);background:rgba(251,243,223,.95);text-align:center}
.item:hover{border-color:var(--wine)}
.item[aria-pressed="true"]{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 2px var(--gold)}
.item img{height:clamp(46px,5.6vw,84px);width:100%;object-fit:contain}
.item b{font-family:"Andika",sans-serif;font-size:clamp(11px,1.05vw,14px);direction:ltr;line-height:1.15}
.price{position:absolute;top:3px;inset-inline-start:3px;font-size:11px;font-weight:600;background:var(--gold);border-radius:999px;padding:0 6px;line-height:18px}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:44px;padding:4px 16px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:500}
.note{margin:10px 0 0;font-size:14px;color:var(--muted)}


/* wallet, currency and buying */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wallet{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:2px 14px 2px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:20px}
.wallet.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.15)}}
.cur{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.price .cur{width:15px;height:15px;vertical-align:-3px}
.item.owned .price{background:#CFE3B4}
.item.trying{border-color:var(--wine);background:#fff;box-shadow:inset 0 0 0 2px var(--wine)}
.buy{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border-radius:14px;background:rgba(244,231,200,.96);border:2.5px solid var(--ink)}
.buy.on{display:flex}
.buy b{font-family:"Andika",sans-serif;direction:ltr}
.buy .btn{min-height:38px;padding:2px 12px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.buy .need{font-size:14px;color:var(--wine);font-weight:600}
.curpick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.curpick button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:2px 12px;border-radius:999px;border:2px solid var(--line);background:var(--paper)}
.curpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.curpick .cur{width:26px;height:26px}
/* choosing a character */
.chooser{position:fixed;inset:0;z-index:5;background:rgba(43,29,46,.82);display:none;overflow:auto;padding:4vh 3vw}
.chooser.on{display:block}
.chooser .card{max-width:1100px;margin:auto;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px 18px 22px;text-align:center}
.chooser h2{font-family:"Karantina",system-ui,sans-serif;font-size:clamp(34px,4.5vw,50px);margin:0;line-height:1}
.chooser p{margin:4px 0 12px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;border-radius:18px;background:transparent;padding:6px}
.who:hover{border-color:var(--line)}
.who[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.who .fig{height:clamp(220px,40vh,380px)}
.who b{font-family:"Henny Penny",serif;font-weight:400;font-size:22px;direction:ltr}
.who small{color:var(--muted);font-size:14px}
@media (max-width:640px){.pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .scene{aspect-ratio:auto;display:grid;grid-template-columns:minmax(0,1fr);background-position:12% center}
  .scene .me{position:relative;left:auto;width:auto;top:auto;bottom:auto;height:min(70vh,520px);margin:34px auto 6px}
  .say{left:0;width:100%;top:6px}
  .shelves{position:static;background:rgba(43,29,46,.6);padding:10px;gap:8px}
}
@media (prefers-reduced-motion:reduce){.fig img.pop{animation:none}}
</style>
</head>
<body>
<section class="band"><div class="wrap">
  <div class="top">
    <div>
      <h1>ארון הבגדים</h1>
      <p class="lead">אב טיפוס לבדיקה. לחיצה על בגד מלבישה אותו לניסיון ואומרת את השם שלו באנגלית. בגד שעוד לא שלך אפשר לקנות.</p>
    </div>
    <div class="bar"><span class="wallet" id="wallet"></span><span class="heads" id="me"></span><button class="btn" id="switch"></button></div>
  </div>
  <div class="scene" id="scene">
    <div class="me"><div class="fig" id="stage" role="img"></div></div>
    <div class="say" id="say" aria-live="polite"></div>
    <div class="shelves">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="buy" id="buy" aria-live="polite"></div>
      <div class="items" id="items"></div>
    </div>
  </div>
  <div class="actions"><button class="btn" id="undress">להוריד הכל</button><button class="btn" id="again">🔊 עוד פעם</button></div>
  <p class="note">לכל דמות יש מלתחה משלה: מה שקנית נשאר אצל הדמות שקנתה. החלפת דמות: פעם אחת בחינם, ואחר כך עולה 5. שמלה מחליפה חולצה וחצאית, ולהפך.</p>
  <div class="curpick" id="curpick"></div>
  <div class="actions"><button class="btn" id="add">לבדיקה: להוסיף 20</button><button class="btn" id="reset">לבדיקה: להתחיל מחדש</button></div>
</div></section>
<div class="chooser" id="chooser" role="dialog" aria-modal="true" aria-labelledby="chooseTitle"><div class="card">
  <h2 id="chooseTitle">מי את בעליית הגג?</h2>
  <p id="chooseNote"></p>
  <div class="pick" id="pick"></div>
  <div class="actions" style="justify-content:center"><button class="btn" id="chooseClose" hidden>להישאר עם הדמות שלי</button></div>
</div></div>
<script>
{
/* layer order, back to front (from the art README): wings, base, tights, shoes, dress/skirt, top, apron/belt, hair, hat, glasses+earrings, held */
const Z={wings:1,base:2,tights:3,shoes:4,dress:5,skirt:5,top:6,apron:7,belt:7,hair:8,hat:9,glasses:10,earrings:10,accessory:11};
const ITEMS=[
  ['dress_ragged-raven','a ragged dress','dress',30],['dress_fairy-leaf','a fairy dress','dress',30],['dress_mushroom-apron','a mushroom dress','dress',35],['dress_moon-cape','a cape dress','dress',35],
  ['top_victorian-blouse','a blouse','top',15],['skirt_cobweb','a cobweb skirt','skirt',15],
  ['tights_raven','purple striped tights','tights',8],['tights_pumpkin','orange striped tights','tights',8],['tights_moth','burgundy striped tights','tights',8],['tights_luna','yellow striped tights','tights',8],
  ['shoes_raven','buckle boots','shoes',15],['shoes_pumpkin','curly elf shoes','shoes',20],['shoes_moth','mushroom boots','shoes',20],['shoes_luna','moon boots','shoes',20],
  ['wings_bat','bat wings','wings',25],['wings_moth','moth wings','wings',25],['wings_cobweb','cobweb wings','wings',25],['wings_dragonfly','dragonfly wings','wings',25],
  ['hat_mushroom','a mushroom hat','hat',15],['hat_witch','a witch hat','hat',15],['hat_moon','a moon headpiece','hat',20],['hat_star-crown','a star crown','hat',20],
  ['hair_braids','braided hair','hair',12],['glasses_round','round glasses','glasses',10],['earrings_moon','moon earrings','earrings',10],
  ['apron_pumpkin','a pumpkin apron','apron',12],['belt_star-bow','a bow belt','belt',10],
  ['accessory_crow','a crow','accessory',12],['accessory_star-wand','a magic wand','accessory',15],['accessory_mushrooms','mushrooms','accessory',8],
].map(([id,en,kind,price])=>({id,en,kind,price}));
const byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const TABS=[['dress','שמלות',['dress']],['top','חולצה וחצאית',['top','skirt']],['tights','גרביונים',['tights']],['shoes','נעליים',['shoes']],['wings','כנפיים',['wings']],['hat','כובעים',['hat']],['face','שיער ותכשיטים',['hair','glasses','earrings']],['extra','סינר וחגורה',['apron','belt']],['hold','חברים ביד',['accessory']]];
/* the faces sit at slightly different heights, so glasses and earrings move per character (percent of the figure height) */
const CHARS=[
  {id:'raven',name:'Raven',he:'ילדת העורב',outfit:['tights_raven','shoes_raven','dress_ragged-raven'],shift:{glasses:-4.8,earrings:-2}},
  {id:'luna',name:'Luna',he:'ילדת הירח',outfit:['tights_luna','shoes_luna','dress_moon-cape'],shift:{glasses:-5.8,earrings:-2}},
  {id:'moth',name:'Moth',he:'ילדת העש',outfit:['tights_moth','shoes_moth','dress_mushroom-apron'],shift:{glasses:-2.2,earrings:-1}},
  {id:'pumpkin',name:'Pumpkin',he:'ילדת הדלעת',outfit:['tights_pumpkin','shoes_pumpkin','dress_fairy-leaf'],shift:{glasses:-5,earrings:-2}},
];
/* one of each kind, except things held; a dress and a top or skirt can't be worn together */
const SINGLE=new Set(['dress','top','skirt','tights','shoes','wings','hat','hair','glasses','earrings','apron','belt']);
const CLASH={dress:['top','skirt'],top:['dress'],skirt:['dress']};

/* the money: earned in practice; which coin it is, the girls choose */
const CUR={
  ruby:{he:'אבני אודם',svg:'<path d="M6 3h12l4 6-10 13L2 9z" fill="#C2213F"/><path d="M2 9h20M6 3l3 6 3 13M18 3l-3 6-3 13M9 9l3-6 3 6" fill="none" stroke="#7A0F25" stroke-width="1.2"/><path d="M7 5l-2 3" stroke="#FFC7D1" stroke-width="1.6" stroke-linecap="round"/><path d="M6 3h12l4 6-10 13L2 9z" fill="none" stroke="#2B1D2E" stroke-width="1.6" stroke-linejoin="round"/>'},
  worm:{he:'תולעים',svg:'<path d="M3 17c2-7 5-7 7-1s5 6 7 0c.8-2.4 2.2-3.6 4-3" fill="none" stroke="#2B1D2E" stroke-width="6.4" stroke-linecap="round"/><path d="M3 17c2-7 5-7 7-1s5 6 7 0c.8-2.4 2.2-3.6 4-3" fill="none" stroke="#E98BA6" stroke-width="3.6" stroke-linecap="round"/><path d="M6.5 12.6l.8 1.4M9.6 14.2l1.4-.3M14.3 18.7l.9-1.3" stroke="#B5546F" stroke-width="1"/><circle cx="20.4" cy="12.6" r=".9" fill="#2B1D2E"/>'},
  eye:{he:'עיניים',svg:'<ellipse cx="12" cy="12" rx="10" ry="8.4" fill="#FFF8E6" stroke="#2B1D2E" stroke-width="1.6"/><path d="M3.6 9.5l3 1.4M4 15l2.6-1.2M20.2 9l-2.7 1.6M19.8 15.4l-2.8-1.2" stroke="#D9485F" stroke-width=".9"/><circle cx="12.6" cy="12" r="4.6" fill="#7B4FA8" stroke="#2B1D2E" stroke-width="1.2"/><circle cx="12.6" cy="12" r="2" fill="#2B1D2E"/><circle cx="14" cy="10.6" r=".9" fill="#fff"/>'},
  frog:{he:'צפרדעים',svg:'<path d="M3 15c0-4 3.2-6.4 9-6.4S21 11 21 15s-4 6-9 6-9-2-9-6z" fill="#7FA83A" stroke="#2B1D2E" stroke-width="1.6"/><circle cx="7.4" cy="8" r="3.4" fill="#7FA83A" stroke="#2B1D2E" stroke-width="1.6"/><circle cx="16.6" cy="8" r="3.4" fill="#7FA83A" stroke="#2B1D2E" stroke-width="1.6"/><circle cx="7.6" cy="8" r="1.7" fill="#FFF8E6"/><circle cx="16.4" cy="8" r="1.7" fill="#FFF8E6"/><circle cx="7.9" cy="8.2" r=".9" fill="#2B1D2E"/><circle cx="16.1" cy="8.2" r=".9" fill="#2B1D2E"/><path d="M8 15.4q4 3 8 0" fill="none" stroke="#2B1D2E" stroke-width="1.3" stroke-linecap="round"/><circle cx="6.4" cy="15" r="1" fill="#E98BA6" opacity=".7"/><circle cx="17.6" cy="15" r="1" fill="#E98BA6" opacity=".7"/>'},
};
const coin=k=>`<svg class="cur" viewBox="0 0 24 24" aria-hidden="true">${CUR[k||st.cur].svg}</svg>`;
const SWITCH_PRICE=5, START=40;

/* state: one chosen character; each character keeps her own wardrobe (bought and worn) */
const KEY='wardrobe-proto-v4';
const fresh=()=>({me:null,switches:0,wallet:START,cur:'ruby',tab:'dress',chars:Object.fromEntries(CHARS.map(c=>[c.id,{owned:[],worn:[],given:false}]))});
let st; try{ st=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
if(!st||!st.chars) st=fresh();
CHARS.forEach(c=>{ const w=st.chars[c.id]||(st.chars[c.id]={owned:[],worn:[]}); w.owned=w.owned.filter(id=>byId[id]); w.worn=w.worn.filter(id=>w.owned.includes(id)); });
if(!CUR[st.cur]) st.cur='ruby';
let trying=null, last='';
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)) }catch(e){} };
const $=id=>document.getElementById(id);
const char=()=>CHARS.find(c=>c.id===st.me)||CHARS[0];
const ward=()=>st.chars[char().id];
/* a character arrives wearing her own original outfit, a gift the first time she is chosen */
function gift(id){ const w=st.chars[id], o=CHARS.find(c=>c.id===id).outfit; if(w.given) return; w.owned=[...new Set([...w.owned,...o])]; w.worn=[...o]; w.given=true; }

/* put an item on a list of worn items, taking off whatever it replaces */
function wear(list,id){
  const it=byId[id], out=new Set([...(SINGLE.has(it.kind)?[it.kind]:[]),...(CLASH[it.kind]||[])]);
  return list.filter(x=>!out.has(byId[x].kind)).concat(id);
}
function layers(c,worn,fresh){
  const list=[{id:'base_'+c.id,z:Z.base}].concat(worn.map(id=>byId[id]).filter(Boolean).map(i=>({id:i.id,z:Z[i.kind],kind:i.kind})));
  list.sort((a,b)=>a.z-b.z);
  return list.map(l=>{
    const dy=l.kind&&c.shift[l.kind]; const style=dy?` style="transform:translateY(${dy}%)"`:'';
    return `<img src="img/${l.id}.webp" alt=""${style}${l.id===fresh?' class="pop"':''}>`;
  }).join('');
}

/* speech: prefer the nicer voices a Mac has, as in the main app */
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); if(!vs.length) return null;
  const score=v=>(/premium/i.test(v.name)?50:0)+(/enhanced|natural|neural/i.test(v.name)?40:0)+(/google us english/i.test(v.name)?35:0)+(/samantha|ava|allison|susan|karen|serena|daniel/i.test(v.name)?20:0)+(/en[-_]US/i.test(v.lang)?5:0)-(/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy/i.test(v.name)?100:0);
  return vs.sort((a,b)=>score(b)-score(a))[0];
}
try{ voice=pickVoice(); speechSynthesis.onvoiceschanged=()=>{ voice=pickVoice(); }; }catch(e){}
function speak(t){ last=t; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(voice) u.voice=voice; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }

function switchLabel(){ return st.switches===0?'להחליף דמות (פעם אחת בחינם)':`להחליף דמות (${SWITCH_PRICE} ${CUR[st.cur].he})`; }
function draw(fresh){
  if(!st.me){ openChooser(); }
  const c=char(), w=ward();
  $('wallet').innerHTML=`${coin()} <span>${st.wallet}</span>`;
  $('wallet').title=CUR[st.cur].he;
  $('me').innerHTML=st.me?`<span class="head" aria-hidden="true"><span class="ring"><img src="img/base_${c.id}.webp" alt=""></span><b>${c.name}</b></span>`:'';
  $('switch').textContent=switchLabel();
  const shown=trying?wear(w.worn,trying):w.worn;
  $('stage').innerHTML=layers(c,shown,fresh);
  $('stage').setAttribute('aria-label',c.he);
  $('tabs').innerHTML=TABS.map(([k,t])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${k===st.tab}">${t}</button>`).join('');
  const kinds=(TABS.find(t=>t[0]===st.tab)||TABS[0])[2];
  $('items').innerHTML=ITEMS.filter(i=>kinds.includes(i.kind)).map(i=>{
    const own=w.owned.includes(i.id);
    return `<button class="item${own?' owned':''}${i.id===trying?' trying':''}" data-item="${i.id}" aria-pressed="${w.worn.includes(i.id)}"><span class="price">${own?'✓ שלי':coin()+i.price}</span><img src="thumb/${i.id}.webp" alt=""><b>${i.en}</b></button>`;
  }).join('');
  const b=$('buy');
  if(trying){
    const it=byId[trying], need=it.price-st.wallet;
    b.innerHTML=`<b>${it.en}</b> <span>${coin()} ${it.price}</span>`+(need>0
      ?`<span class="need">חסרים לך עוד ${need} ${CUR[st.cur].he}. עוד קצת תרגול!</span><button class="btn" data-act="cancel">להוריד</button>`
      :`<button class="btn primary" data-act="buy">לקנות</button><button class="btn" data-act="cancel">לא עכשיו</button>`);
    b.classList.add('on');
  } else b.classList.remove('on');
  $('curpick').innerHTML='איזה כסף? (שהבנות יבחרו) '+Object.entries(CUR).map(([k,v])=>`<button data-cur="${k}" aria-pressed="${k===st.cur}">${coin(k)}${v.he}</button>`).join('');
  save();
}
function openChooser(){
  const first=!st.me;
  $('chooseNote').textContent=first?'בוחרים דמות אחת, והיא מגיעה עם הבגדים שלה. אפשר להחליף אחר כך: פעם אחת בחינם.'
    :(st.switches===0?'ההחלפה הזאת בחינם. כל דמות שומרת את הבגדים שלה.':`החלפה עולה ${SWITCH_PRICE} ${CUR[st.cur].he}. כל דמות שומרת את הבגדים שלה.`);
  $('pick').innerHTML=CHARS.map(c=>`<button class="who" data-pick="${c.id}" aria-pressed="${c.id===st.me}"><span class="fig">${layers(c,st.chars[c.id].given?st.chars[c.id].worn:c.outfit)}</span><b>${c.name}</b><small>${c.he}</small></button>`).join('');
  $('chooseClose').hidden=first;
  $('chooser').classList.add('on');
}
const closeChooser=()=>$('chooser').classList.remove('on');
function pay(n){ st.wallet-=n; const el=$('wallet'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  const w=ward();
  if(t.dataset.pick){
    const id=t.dataset.pick;
    if(!st.me){ st.me=id; gift(id); closeChooser(); trying=null; draw(); return; }
    if(id===st.me){ closeChooser(); return; }
    const cost=st.switches===0?0:SWITCH_PRICE;
    if(cost>st.wallet){ $('chooseNote').textContent=`בשביל להחליף צריך ${SWITCH_PRICE} ${CUR[st.cur].he}, ויש לך ${st.wallet}.`; return; }
    if(cost) pay(cost);
    st.switches++; st.me=id; gift(id); trying=null; $('say').textContent=''; closeChooser(); draw(); return;
  }
  if(t.id==='chooseClose'){ closeChooser(); return; }
  if(t.id==='switch'){ openChooser(); return; }
  if(t.dataset.tab){ st.tab=t.dataset.tab; draw(); return; }
  if(t.dataset.cur){ st.cur=t.dataset.cur; draw(); return; }
  if(t.dataset.act==='cancel'){ trying=null; $('say').textContent=''; draw(); return; }
  if(t.dataset.act==='buy'&&trying){
    const it=byId[trying]; if(it.price>st.wallet) return;
    pay(it.price); w.owned.push(it.id); w.worn=wear(w.worn,it.id); trying=null; draw(); return;
  }
  if(t.dataset.item){
    const id=t.dataset.item, it=byId[id];
    if(w.owned.includes(id)){
      trying=null;
      if(w.worn.includes(id)){ w.worn=w.worn.filter(x=>x!==id); $('say').textContent=''; draw(); return; }
      w.worn=wear(w.worn,id); $('say').textContent=it.en; speak(it.en); draw(id); return;
    }
    if(trying===id){ trying=null; $('say').textContent=''; draw(); return; }
    trying=id; $('say').textContent=it.en; speak(it.en); draw(id); return;
  }
  if(t.id==='undress'){ w.worn=[]; trying=null; $('say').textContent=''; draw(); }
  if(t.id==='again'&&last) speak(last);
  if(t.id==='add'){ pay(-20); draw(); }
  if(t.id==='reset'){ st=fresh(); trying=null; $('say').textContent=''; closeChooser(); draw(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&st.me) closeChooser(); });
draw();
}
</script>
</body>
</html>
