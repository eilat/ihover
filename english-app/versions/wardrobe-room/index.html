<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ארון הבגדים · שלוש גרסאות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@400;600&display=swap">
<style>body{margin:0;background:#E9D6AE;color:#2B1D2E;font:16px/1.5 Rubik,system-ui,sans-serif;padding:24px max(3vw,14px)}h1{font:700 48px/1 Karantina,sans-serif;margin:0}.lead{color:#6B5648;max-width:70ch}
figure{margin:22px 0 0;background:#F4E7C8;border:2.5px solid #2B1D2E;border-radius:18px;padding:12px}figure.pick{box-shadow:0 0 0 4px #E6B53A}
.frame{position:relative;width:100%;aspect-ratio:1280/1060;overflow:hidden;border-radius:10px}.frame iframe{position:absolute;top:0;right:0;width:1280px;height:1060px;border:0;transform-origin:top right;transform:scale(var(--s,.5))}
figcaption b{font-size:20px}figcaption p{margin:2px 0}.tag{background:#E6B53A;border-radius:999px;padding:0 10px;font-size:14px;margin-inline-start:6px}a{color:#8C3550;font-weight:600}</style></head><body>
<h1>ארון הבגדים · שלוש גרסאות</h1><p class="lead">בכל אחת: הקטגוריות על הדלת הימנית מלמעלה למטה, מקום אחר למחיר ולקנייה, דרך אחרת לסדר את הבגדים בארון, וחדר רגוע יותר עם הפתעות. לחצי על החתול, הנרות, המראה, התיבה, הפנס או העטלף (לא כולם בכל גרסה): כל אחד אומר את המילה שלו באנגלית ועושה משהו קטן.</p>
<figure class="pick"><div class="frame"><iframe src="v1.html" loading="lazy" title="גרסה 1"></iframe></div>
<figcaption><b>1. שלטי עץ על הדלת</b> <span class="tag">ההמלצה שלי</span><p>שלטים מגולפים על הדלת, בגדים תלויים על המוט, פתק קלף לקנייה במדף התחתון, החדר מעומעם בצד.</p><a href="v1.html" target="_blank">לפתוח בגודל מלא ←</a></figcaption></figure><figure class=""><div class="frame"><iframe src="v2.html" loading="lazy" title="גרסה 2"></iframe></div>
<figcaption><b>2. תוויות פליז עם תמונה</b><p>על הדלת לוחיות פליז עם ציור קטן ומילה, כל בגד בתא עץ משלו, וכפתור קנייה גדול על המגירות. החדר מטושטש והארון חד.</p><a href="v2.html" target="_blank">לפתוח בגודל מלא ←</a></figcaption></figure><figure class=""><div class="frame"><iframe src="v3.html" loading="lazy" title="גרסה 3"></iframe></div>
<figcaption><b>3. תגיות קלף בלילה</b><p>תגיות קלף בכתב יד תלויות בחוטים על הדלת, הבגדים מרחפים במדף, הדמות שואלת בבועה אם לקנות. החדר בחושך עם פנס על הדמות ועל הארון.</p><a href="v3.html" target="_blank">לפתוח בגודל מלא ←</a></figcaption></figure>
<script>const fit=()=>document.querySelectorAll('.frame').forEach(f=>f.style.setProperty('--s',f.clientWidth/1280));addEventListener('resize',fit);fit();</script></body></html>
