<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מתמטיקידס · הבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Assistant:wght@400;600&display=swap">
<style>
/* הבית: a separate screen from the lessons. The room is the hero; a shop with tabs for the home and for
   the animal; bonus practice on the side that gets harder gradually; a surprise box for a personal record
   or a challenge question. */
:root{--bg:#EEF1F4;--surface:#fff;--ink:#1E2633;--muted:#5A6577;--line:#D3DAE3;--accent:#7444C9;--coin:#D99A06;--coin-soft:#FFF1C7;--good:#1F7A4D;--good-soft:#DDF2E7;--hint:#FFF1C9;
  --f-display:"Rubik",system-ui,sans-serif;--f-body:"Assistant","Rubik",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12161D;--surface:#1B212B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2E3746;--coin-soft:#3A3018;--good:#3FB37A;--good-soft:#1C3A2B;--hint:#3D3420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161D;--surface:#1B212B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2E3746;--coin-soft:#3A3018;--good:#3FB37A;--good-soft:#1C3A2B;--hint:#3D3420;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.coin{width:22px;height:22px;vertical-align:-5px;flex:none}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1.5px solid var(--line)}
.kids{display:flex;gap:8px}
.kid{display:flex;align-items:center;gap:8px;min-height:48px;padding:3px 14px 3px 4px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:17px}
.kid[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.kid .av{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--accent) 15%,var(--surface));overflow:hidden;display:grid;place-items:center}
.kid .av svg{width:46px;height:56px;margin-top:10px}
.title{flex:1;text-align:center;font-family:var(--f-display);font-size:22px;font-weight:600}
.bank{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:22px;background:var(--coin-soft);padding:6px 16px;border-radius:999px}
.tolessons{display:flex;align-items:center;gap:6px;min-height:48px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600}
/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.06);min-width:0}
h2{font-family:var(--f-display);font-size:21px;margin:0 0 6px}
.meta{color:var(--muted);font-size:14px;margin:0}
.room{border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.room svg.scene{display:block;width:100%;height:auto}
.friend{cursor:pointer}
.preview-tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
/* animals */
.animals{display:flex;gap:8px;flex-wrap:wrap}
.an{width:78px;padding:4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;font-size:13px}
.an svg{width:60px;height:72px}
.an[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.an.locked{cursor:default;color:var(--muted)} .an.locked svg{filter:brightness(0);opacity:.15}
/* shop */
.seg{display:flex;gap:6px;margin:6px 0 10px}
.seg button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid var(--line)}
.tab{min-height:42px;padding:4px 16px;border-radius:999px;border:2px solid transparent;background:transparent;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item.on{border-color:var(--good);background:var(--good-soft)}
.item.pv{border-color:var(--accent)}
.th{width:110px;height:96px;display:grid;place-items:center;overflow:hidden}
.th svg{max-width:100%;max-height:100%}
.item b{font-size:15px}
.price{display:flex;align-items:center;gap:4px;font-weight:600}
.item .btn{min-height:38px;padding:3px 12px;font-size:14px;width:100%}
.need{font-size:12px;color:var(--muted)}
.btn{min-height:48px;padding:6px 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
/* bonus practice */
.practice{position:sticky;top:12px}
.level{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:14px;color:var(--muted)}
.bars{display:flex;gap:4px;direction:ltr}
.bars i{width:14px;height:10px;border-radius:3px;background:var(--line)}
.bars i.on{background:var(--accent)}
.q{font-family:var(--f-display);font-weight:600;font-size:40px;text-align:center;font-variant-numeric:tabular-nums}
.q.ch{color:var(--coin)}
.ans{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0}
.ans input{font:inherit;font-family:var(--f-display);font-size:30px;width:150px;height:58px;text-align:center;border:3px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;min-height:42px;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.sw.run{border-color:var(--accent);color:var(--accent)}
.best{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
.msg{padding:10px 14px;border-radius:12px;background:var(--hint);margin-top:10px}
.msg.ok{background:var(--good-soft)}
.chcard{border:2px dashed var(--coin);background:var(--coin-soft);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chtag{display:inline-block;background:var(--coin);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;margin-bottom:4px}
.say{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
/* modals */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;z-index:9;padding:16px}
.modal{background:var(--surface);border-radius:24px;padding:24px;max-width:700px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.modal h2{font-size:26px}
.gift{width:130px;height:130px;animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.choice{border:3px solid var(--line);border-radius:18px;padding:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.choice:nth-child(2){animation-delay:.1s}.choice:nth-child(3){animation-delay:.2s}
.choice:hover{border-color:var(--accent)}
.choice .th{width:140px;height:120px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.starters{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.starters button{border:3px solid var(--line);border-radius:18px;background:var(--surface);padding:8px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:20px;font-weight:600}
.starters button:hover{border-color:var(--accent)}
.starters svg{width:130px;height:156px}
.testbar{max-width:1240px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.testbar button{font-size:13px;min-height:34px;padding:2px 12px;border-radius:999px;border:1.5px dashed var(--line);background:transparent;color:var(--muted)}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}.practice{position:static}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="bar" id="bar"></header>
<div class="wrap" id="app"></div>
<div class="testbar">לבדיקה בלבד: <button data-act="simLesson">סיימתי שיעור (פותח חיה חדשה)</button><button data-act="reset">להתחיל את הבית מחדש</button></div>
<div id="overlay"></div>
<script>
/* Shared art + logic for the three reward prototypes.
   A character = an animal + one worn item per category. All parts share one geometry
   (viewBox 0 0 200 240, head centre 100,100 r58, body centre 100,188), so every item fits every animal. */

const ANIMALS = {
  cat:     {name:'חתולה',     fur:'#E8A25B', light:'#F7D9B5', dark:'#B86E2C'},
  bunny:   {name:'ארנבת',     fur:'#E9E4E0', light:'#FFFFFF', dark:'#B9AEA8'},
  fox:     {name:'שועלה',     fur:'#E07B39', light:'#FFF4E8', dark:'#5A3420'},
  bear:    {name:'דובה',      fur:'#A8754F', light:'#E6C7A6', dark:'#6E4A30'},
  panda:   {name:'פנדה',      fur:'#F6F5F1', light:'#FFFFFF', dark:'#2B2B2E', body:'#2B2B2E'},
  owl:     {name:'ינשופה',    fur:'#9C7457', light:'#F1E4D1', dark:'#6B4A35'},
  dino:    {name:'דינוזאורית', fur:'#6CC08B', light:'#DDF3C9', dark:'#3E8E5D'},
  unicorn: {name:'חד־קרן',    fur:'#EFE2FA', light:'#FFFFFF', dark:'#C9B8DA'},
  squirrel:{name:'סנאית',     fur:'#C8743A', light:'#F3D6B4', dark:'#8A4B1F'}
};
const ANIMAL_ORDER = ['cat','bunny','fox','bear','panda','owl','dino','unicorn','squirrel'];

/* parts drawn behind the body and head: tails, spikes, mane */
function backSvg(a, A){
  if(a==='squirrel') return `<path d="M140 226 Q206 222 196 150 Q190 104 150 96 Q176 120 168 150 Q160 182 132 196Z" fill="${A.fur}"/><path d="M150 210 Q192 200 186 154 Q182 126 160 112 Q174 136 168 160 Q162 186 142 200Z" fill="${A.light}" opacity=".55"/>`;
  if(a==='dino') return `<path d="M140 214 Q196 214 204 176 Q184 196 148 192Z" fill="${A.fur}"/>
    <g fill="${A.dark}"><path d="M70 50 L80 26 L90 46Z"/><path d="M90 44 L100 18 L110 44Z"/><path d="M110 46 L120 26 L130 50Z"/><path d="M130 56 L144 40 L146 64Z"/></g>`;
  if(a==='unicorn') return `<path d="M128 52 Q170 60 166 110 Q176 140 156 162 Q150 128 136 104Z" fill="#C89BF0"/><path d="M134 66 Q160 80 156 116 Q164 136 150 150 Q146 120 136 100Z" fill="#7FC8F8"/><path d="M140 82 Q154 98 148 126" stroke="#FF9EC7" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  return '';
}
function earsSvg(a, A){
  if(a==='cat') return `<path d="M50 78 L58 26 L94 54 Z" fill="${A.fur}"/><path d="M150 78 L142 26 L106 54 Z" fill="${A.fur}"/><path d="M60 66 L63 40 L82 55 Z" fill="#F4A9B8"/><path d="M140 66 L137 40 L118 55 Z" fill="#F4A9B8"/>`;
  if(a==='bunny') return `<ellipse cx="74" cy="30" rx="15" ry="42" fill="${A.fur}" transform="rotate(-10 74 30)"/><ellipse cx="126" cy="30" rx="15" ry="42" fill="${A.fur}" transform="rotate(10 126 30)"/><ellipse cx="74" cy="32" rx="7" ry="30" fill="#F4B8C4" transform="rotate(-10 74 32)"/><ellipse cx="126" cy="32" rx="7" ry="30" fill="#F4B8C4" transform="rotate(10 126 32)"/>`;
  if(a==='fox') return `<path d="M46 84 L50 18 L96 52 Z" fill="${A.fur}"/><path d="M154 84 L150 18 L104 52 Z" fill="${A.fur}"/><path d="M50 30 L52 18 L64 28 Z M150 30 L148 18 L136 28 Z" fill="${A.dark}"/>`;
  if(a==='bear') return `<circle cx="56" cy="56" r="22" fill="${A.fur}"/><circle cx="144" cy="56" r="22" fill="${A.fur}"/><circle cx="56" cy="56" r="11" fill="${A.light}"/><circle cx="144" cy="56" r="11" fill="${A.light}"/>`;
  if(a==='panda') return `<circle cx="56" cy="54" r="21" fill="${A.dark}"/><circle cx="144" cy="54" r="21" fill="${A.dark}"/>`;
  if(a==='owl') return `<path d="M52 70 L50 30 L82 52Z" fill="${A.dark}"/><path d="M148 70 L150 30 L118 52Z" fill="${A.dark}"/>`;
  if(a==='unicorn') return `<path d="M56 70 L60 34 L86 54Z" fill="${A.fur}"/><path d="M144 70 L140 34 L114 54Z" fill="${A.fur}"/><path d="M63 62 L65 44 L78 55Z M137 62 L135 44 L122 55Z" fill="#F4B8D8"/>`;
  if(a==='squirrel') return `<path d="M54 74 L58 30 L86 54Z" fill="${A.fur}"/><path d="M146 74 L142 30 L114 54Z" fill="${A.fur}"/><path d="M58 30 L52 18 M58 30 L62 16 M142 30 L148 18 M142 30 L138 16" stroke="${A.dark}" stroke-width="4" stroke-linecap="round"/>`;
  return ''; // dino: no ears
}
function faceSvg(a, A){
  const eyes = (r=7) => `<circle cx="78" cy="100" r="${r}" fill="#2A2225"/><circle cx="122" cy="100" r="${r}" fill="#2A2225"/><circle cx="${78+r*.35}" cy="${100-r*.35}" r="${r*.34}" fill="#fff"/><circle cx="${122+r*.35}" cy="${100-r*.35}" r="${r*.34}" fill="#fff"/>`;
  const cheeks = `<ellipse cx="66" cy="117" rx="8" ry="5" fill="#F29BA8" opacity=".6"/><ellipse cx="134" cy="117" rx="8" ry="5" fill="#F29BA8" opacity=".6"/>`;
  const mouth = `<path d="M100 118 L100 124 M92 126 Q100 132 108 126" stroke="#3B2A2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const nose = c => `<path d="M94 113 Q100 119 106 113 Q100 110 94 113Z" fill="${c}"/>`;
  if(a==='owl') return `<circle cx="78" cy="98" r="19" fill="${A.light}"/><circle cx="122" cy="98" r="19" fill="${A.light}"/>${eyes(9)}
    <path d="M92 112 L100 128 L108 112Z" fill="#F2A33A"/>${cheeks}`;
  if(a==='panda') return `<ellipse cx="76" cy="102" rx="15" ry="12" fill="${A.dark}" transform="rotate(-25 76 102)"/><ellipse cx="124" cy="102" rx="15" ry="12" fill="${A.dark}" transform="rotate(25 124 102)"/>
    <circle cx="78" cy="100" r="6" fill="#fff"/><circle cx="122" cy="100" r="6" fill="#fff"/><circle cx="78" cy="100" r="3.6" fill="#2A2225"/><circle cx="122" cy="100" r="3.6" fill="#2A2225"/>
    ${cheeks}${nose('#2A2225')}${mouth}`;
  if(a==='dino') return `<ellipse cx="100" cy="124" rx="30" ry="18" fill="${A.light}"/>${eyes(7)}${cheeks}
    <circle cx="92" cy="116" r="2.4" fill="${A.dark}"/><circle cx="108" cy="116" r="2.4" fill="${A.dark}"/>
    <path d="M86 128 Q100 138 114 128" stroke="#2F5D41" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const muzzle = a==='fox' ? `<path d="M62 112 Q100 160 138 112 Q120 104 100 108 Q80 104 62 112Z" fill="${A.light}"/>`
               : a==='bear' ? `<ellipse cx="100" cy="122" rx="26" ry="19" fill="${A.light}"/>`
               : a==='squirrel' ? `<ellipse cx="100" cy="122" rx="24" ry="17" fill="${A.light}"/>`
               : a==='cat' ? `<ellipse cx="100" cy="122" rx="22" ry="15" fill="${A.light}"/>` : '';
  const whisk = a==='cat'||a==='bunny' ? `<path d="M70 120 L46 116 M70 126 L46 128 M130 120 L154 116 M130 126 L154 128" stroke="${A.dark}" stroke-width="2" stroke-linecap="round"/>` : '';
  const teeth = a==='squirrel' ? `<rect x="96" y="127" width="8" height="7" rx="1.5" fill="#fff" stroke="#3B2A2A" stroke-width="1.2"/>` : '';
  return `${muzzle}${eyes(7)}${cheeks}${nose(a==='bunny'||a==='unicorn'?'#E58AA0':'#3B2A2A')}${mouth}${teeth}${whisk}`;
}
/* parts drawn on top of the head: horn, forelock */
function headExtrasSvg(a, A){
  if(a==='unicorn') return `<path d="M100 8 L90 50 L110 50Z" fill="#F7C948" stroke="#E0A800" stroke-width="2" stroke-linejoin="round"/><path d="M92 40 L108 34 M94 28 L106 24" stroke="#E0A800" stroke-width="2.4"/>
    <path d="M80 50 Q96 40 112 50 Q100 60 86 64Z" fill="#FF9EC7"/>`;
  if(a==='owl') return `<path d="M62 76 Q78 68 92 78 M108 78 Q122 68 138 76" stroke="${A.dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  return '';
}
/* body details */
function bodySvg(a, A){
  const body=A.body||A.fur;
  let s=`<ellipse cx="100" cy="190" rx="54" ry="48" fill="${body}"/><ellipse cx="100" cy="198" rx="32" ry="30" fill="${a==='panda'?'#F6F5F1':A.light}" opacity=".95"/>`;
  if(a==='owl') s+=`<path d="M48 176 Q40 214 70 230 Q62 200 66 172Z M152 176 Q160 214 130 230 Q138 200 134 172Z" fill="${A.dark}"/><path d="M86 188 q4 4 8 0 M106 188 q4 4 8 0 M96 204 q4 4 8 0 M86 218 q4 4 8 0 M106 218 q4 4 8 0" stroke="${A.dark}" stroke-width="2" fill="none"/>`;
  if(a==='dino') s+=`<g fill="${A.dark}" opacity=".5"><circle cx="64" cy="186" r="6"/><circle cx="140" cy="200" r="5"/><circle cx="132" cy="176" r="4"/></g>`;
  return s;
}

/* ---- items: [category, id, name, price, svg(A) or {back, front}] ---- */
const CATS = [
  {id:'outfit', name:'בגדים'}, {id:'hair', name:'תסרוקות'}, {id:'hat', name:'כובעים'},
  {id:'glasses', name:'משקפיים'}, {id:'pet', name:'חיות מחמד'}, {id:'object', name:'חפצים'}
];
const ITEMS = [
  // clothes (drawn on the body)
  {cat:'outfit', id:'stripes', name:'חולצת פסים', price:4, svg:()=>`<path d="M52 170 Q100 150 148 170 L152 214 Q100 232 48 214Z" fill="#3E7BD8"/><path d="M50 182 Q100 166 150 182 M49 196 Q100 182 151 196 M49 210 Q100 198 151 210" stroke="#fff" stroke-width="6" fill="none"/>`},
  {cat:'outfit', id:'dress', name:'שמלה', price:6, svg:()=>`<path d="M60 166 Q100 154 140 166 L146 186 L160 228 Q100 242 40 228 L54 186Z" fill="#E8577E"/><circle cx="80" cy="206" r="4" fill="#fff"/><circle cx="104" cy="214" r="4" fill="#fff"/><circle cx="126" cy="202" r="4" fill="#fff"/><circle cx="92" cy="186" r="4" fill="#fff"/><circle cx="118" cy="184" r="4" fill="#fff"/>`},
  {cat:'outfit', id:'cape', name:'גלימה', price:8, svg:{back:()=>`<path d="M40 156 Q100 138 160 156 L176 236 Q100 226 24 236Z" fill="#7B4BC9"/>`, front:()=>`<path d="M66 156 L100 172 L134 156" stroke="#F2B21E" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="100" cy="172" r="7" fill="#F2B21E"/>`}},
  {cat:'outfit', id:'overalls', name:'אוברול', price:5, svg:()=>`<path d="M58 186 L142 186 L150 224 Q100 238 50 224Z" fill="#2F9E8F"/><path d="M70 160 L74 190 M130 160 L126 190" stroke="#2F9E8F" stroke-width="9" stroke-linecap="round"/><rect x="86" y="194" width="28" height="18" rx="4" fill="#257E72"/>`},
  // hair (on the head, between the ears)

/* draw one character. worn = {cat: itemId}. preview = {cat: itemId} overrides (for "try on") */
function drawChar(animal, worn={}, preview={}){
  const A = ANIMALS[animal], w = {...worn, ...preview};
  const it = c => w[c] ? itemById(w[c]) : null;
  const part = (item, side) => !item ? '' : typeof item.svg === 'function' ? (side==='front' ? item.svg(A) : '') : (item.svg[side] ? item.svg[side](A) : '');
  const out = it('outfit');
  return `<svg viewBox="-6 -18 216 260" role="img" aria-label="${A.name}">
    ${part(out,'back')}
    ${backSvg(animal, A)}
    ${bodySvg(animal, A)}
    ${part(out,'front')}
    ${animal==='fox' ? `<path d="M144 206 Q186 190 182 156 Q170 176 150 186Z" fill="${A.fur}"/><path d="M178 160 Q184 168 181 176 Q174 170 170 168Z" fill="#fff"/>` : ''}
    ${animal==='bunny' ? `<circle cx="150" cy="214" r="12" fill="#fff"/>` : ''}
    ${earsSvg(animal, A)}
    <circle cx="100" cy="100" r="58" fill="${A.fur}"/>
    ${faceSvg(animal, A)}
    ${headExtrasSvg(animal, A)}
    ${part(it('hair'),'front')}${part(it('hat'),'front')}${part(it('glasses'),'front')}${part(it('object'),'front')}${part(it('pet'),'front')}
  </svg>`;
}

/* ---- earning: a mini lesson of 5 mental-addition questions ---- */
const QUESTIONS = [[300,400],[60,30],[432,251],[253,172],[50,70]];
const STARS_PER = 3, LESSON_LEN = QUESTIONS.length;
const HINTS = {
  '300+400':'3 מאות ועוד 4 מאות. כמה מאות זה?',
  '60+30':'6 עשרות ועוד 3 עשרות.',
  '432+251':'מאות: 400 + 200. עשרות: 30 + 50. אחדות: 2 + 1.',
  '253+172':'מאות: 200 + 100. עשרות: 50 + 70 = 120. אחדות: 3 + 2.',
  '50+70':'5 + 7 = 12, אז 50 + 70 = 120.'
};

function loadState(key){
  const fresh = {animal:'cat', animals:['cat'], items:[], worn:{}, stars:10, lessons:0, q:0, wrong:0, gifts:0};
  try{ const s = JSON.parse(localStorage.getItem(key)||'null'); return s ? {...fresh, ...s} : fresh; }catch(e){ return fresh; }
}
function saveState(key, s){ try{ localStorage.setItem(key, JSON.stringify(s)); }catch(e){} }

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = x => `<span class="ltr">${x}</span>`;
const STAR = '<svg viewBox="0 0 24 24" class="star" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
let VOICE=null;
function pickVoice(){ try{ const he=speechSynthesis.getVoices().filter(v=>/^he|^iw/i.test(v.lang)); const s=v=>(/premium/i.test(v.name)?4:0)+(/enhanced/i.test(v.name)?3:0); VOICE=he.sort((a,b)=>s(b)-s(a))[0]||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){}
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='he-IL'; if(VOICE) u.voice=VOICE; u.rate=.9; speechSynthesis.speak(u);}catch(e){} }

/* answer a question; returns {ok, stars, lessonDone, unlocked} */
function answer(S, value){
  const [x,y] = QUESTIONS[S.q];
  if(+value !== x+y){ S.wrong++; return {ok:false, hint: S.wrong>=2 ? HINTS[`${x}+${y}`] : 'עוד לא. נסי שוב, את יכולה.'}; }
  S.stars += STARS_PER; S.wrong = 0; S.q++;
  let lessonDone=false, unlocked=null;
  if(S.q >= LESSON_LEN){
    S.q = 0; S.lessons++; lessonDone = true;
    const next = ANIMAL_ORDER.find(a => !S.animals.includes(a));
    if(next){ S.animals.push(next); unlocked = next; }
  }
  return {ok:true, stars:STARS_PER, lessonDone, unlocked};
}

    ${under}${back}${objs}

}

const COIN='<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F2C230" stroke="#C99A12" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#C99A12" stroke-width="1.6"/></svg>';
const IC={
  watch:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4M12 2v3"/></svg>',

  map:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>'
};
const GIFT=`<svg class="gift" viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="40" width="76" height="52" rx="6" fill="#E8457A"/><rect x="6" y="28" width="88" height="18" rx="5" fill="#F06292"/><rect x="44" y="28" width="12" height="64" fill="#FFD54F"/><path d="M50 28 C38 8 18 14 30 26 Z M50 28 C62 8 82 14 70 26 Z" fill="#FFD54F"/></svg>`;
const KIDS=[{id:'lili',name:'לילי'},{id:'nori',name:'נורי'}];
const STARTERS=['cat','bunny','fox'];

/* ---------- state per girl ---------- */
let kidId; try{ kidId=localStorage.getItem('home:kid')||'lili'; }catch(e){ kidId='lili'; }
function fresh(){ return {chosen:false, animal:'cat', animals:[], wallpaper:'wp-plain', items:[], worn:{}, coins:12, level:1, streak:0, best:{}, qn:0, q:null, challenge:null, pendingChallenge:false}; }
function load(id){ try{ const s=JSON.parse(localStorage.getItem('home:'+id)||'null'); return s?{...fresh(),...s}:fresh(); }catch(e){ return fresh(); } }
function save(){ try{ localStorage.setItem('home:'+kidId, JSON.stringify(S)); localStorage.setItem('home:kid',kidId); }catch(e){} }
let S=load(kidId);
let side='home', tab='wallpaper', preview=null, msg=null, modal=null, offer=null;
const T={ms:0,from:null,running:false,used:false};

/* ---------- bonus practice: 5 difficulty levels, up after 2 in a row, down after a hard time ---------- */
const LEVELS=[null,
  {name:'קל',          gen:()=>{ const a=r(2,8), b=r(1,10-a); return [a,b]; }},
  {name:'עשרות',       gen:()=>{ const a=r(1,7), b=r(1,9-a); return [a*10,b*10]; }},
  {name:'דו־ספרתי',     gen:()=>{ const a=r(1,6),b=r(1,8-a),c=r(0,8),d=r(0,9-c); return [a*10+c,b*10+d]; }},
  {name:'מאות',        gen:()=>{ const h=r(1,6),i=r(1,8-h),t=r(0,8),u=r(0,9-t),o=r(0,8),p=r(0,9-o); return [h*100+t*10+o,i*100+u*10+p]; }},
  {name:'מאות עם מעבר', gen:()=>{ const h=r(1,6),i=r(1,7-h),t=r(3,9),u=r(10-t,9),o=r(0,8),p=r(0,9-o); return [h*100+t*10+o,i*100+u*10+p]; }}
];
function r(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
const CHALLENGES=[[368,457],[495,238],[647,286],[579,264]];
function nextQ(){
  S.qn++; S.q=null; msg=null; T.ms=0; T.from=null; T.running=false; T.used=false;
  if(S.qn%5===0){ S.pendingChallenge=true; save(); return; }
  const [a,b]=LEVELS[S.level].gen(); S.q={a,b,wrong:0,level:S.level}; save();
}
function hintFor(q){
  const da=[Math.floor(q.a/100),Math.floor(q.a/10)%10,q.a%10], db=[Math.floor(q.b/100),Math.floor(q.b/10)%10,q.b%10];
  if(q.a<10 && q.b<10) return `אפשר לספור מ-${q.a} הלאה.`;
  if(q.a<100) return q.a%10===0 && q.b%10===0 ? `${q.a/10} עשרות ועוד ${q.b/10} עשרות.` : `קודם העשרות: ${da[1]*10} + ${db[1]*10}. אחר כך האחדות: ${da[2]} + ${db[2]}.`;
  return `מאות: ${da[0]*100} + ${db[0]*100}. עשרות: ${da[1]*10} + ${db[1]*10}. אחדות: ${da[2]} + ${db[2]}.`;
}
const ms=()=>T.ms+(T.from!=null?Date.now()-T.from:0);
const fmt=m=>{ const s=Math.floor(m/1000); return s<60 ? `${(Math.floor(m/100)/10).toFixed(1)} שניות` : `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} דקות`; };
setInterval(()=>{ const el=document.getElementById('swt'); if(el && T.running) el.textContent=fmt(ms()); },500);
function check(){
  const inp=document.getElementById('ans'); if(!inp) return; const v=inp.value.trim(); if(!v) return;
  const q=S.challenge||S.q; if(!q) return;
  if(+v!==q.a+q.b){
    q.wrong++; inp.value='';
    msg={text: q.wrong>=3 ? `התשובה היא ${q.a+q.b}. ${hintFor(q)}` : q.wrong===2 ? `רמז: ${hintFor(q)}` : 'עוד לא. נסי שוב, את יכולה.'};
    if(q.wrong>=3) settle(q,false,msg.text);
    render(); return;
  }
  settle(q,true); render();
}
function settle(q, solved, reveal){
  if(T.from!=null){ T.ms+=Date.now()-T.from; T.from=null; } T.running=false;
  const time=ms(), isCh=!!S.challenge;
  let gain = isCh ? 8 : q.level+2, text=solved?`נכון! קיבלת ${gain} מטבעות.`:`${reveal} קיבלת ${gain} מטבעות על ההתמדה.`;
  S.coins+=gain;
  let box=false;
  if(isCh){ if(solved){ box=true; text=`פתרת את שאלת האתגר! ${gain} מטבעות ותיבת הפתעה.`; } S.challenge=null; }
  else {
    if(solved && T.used && q.wrong===0){
      const prev=S.best[q.level];
      if(prev==null){ S.best[q.level]=time; text+=` ⏱ ${fmt(time)}: זה השיא הראשון שלך ברמה הזאת.`; }
      else if(time<prev){ S.best[q.level]=time; box=true; text+=` ⏱ ${fmt(time)}: שברת את השיא שלך! תיבת הפתעה.`; }
      else text+=` ⏱ ${fmt(time)}. השיא שלך: ${fmt(prev)}.`;
    }
    // difficulty: up after two clean answers in a row, down after a hard time
    if(solved && q.wrong===0){ S.streak++; if(S.streak>=2 && S.level<5){ S.level++; S.streak=0; text+=' עלית רמה!'; } }
    else { S.streak=0; if(q.wrong>=2 && S.level>1){ S.level--; } }
  }
  nextQ();
  msg={ok:solved,text};
  if(box) openBox();
}
/* ---------- surprise box: choose 1 of 3 things she doesn't have yet ---------- */
const ALL_BUY=()=>[...WALLPAPERS.filter(w=>w.price>0).map(w=>({...w,kind:'wallpaper'})), ...ROOM_ITEMS.map(i=>({...i,kind:'room'})), ...ITEMS.map(i=>({...i,kind:i.cat==='pet'||i.cat==='object'?'room':'wear'}))];
function openBox(){
  const left=ALL_BUY().filter(i=>!isOwned(i.id)); if(!left.length) return;
  offer=left.sort(()=>Math.random()-.5).slice(0,3).map(i=>i.id); modal='box';
}
function isOwned(id){ return S.items.includes(id) || (S.ownedWp||[]).includes(id); }
function thumb(id){
  const wp=WALLPAPERS.find(w=>w.id===id); if(wp) return `<svg viewBox="0 0 120 90"><defs>${wp.def}</defs><rect width="120" height="90" rx="8" fill="${wp.fill}"/></svg>`;
  const ri=ROOM_ITEMS.find(x=>x.id===id); if(ri) return thumbRoom(ri);
  const it=itemById(id); if(!it) return '';
  if(it.cat==='pet') return `<svg viewBox="0 180 72 62">${it.svg(ANIMALS[S.animal])}</svg>`;
  if(it.cat==='object'){ const s=OBJ_SPOTS[id]; return `<svg viewBox="${s[4]}">${it.svg(ANIMALS[S.animal])}</svg>`; }
  return drawChar(S.animal,{},{[it.cat]:id});
}
function thumbRoom(ri){ // render the item alone in a frame that fits it
  const box={bed:'8 210 230 120',desk:'590 180 190 160','armchair':'136 256 120 110','rug-round':'200 330 400 100',picture:'100 50 130 100',bookshelf:'550 80 170 70',clock:'244 34 60 60',garland:'10 10 380 70',plant:'236 244 80 96',cactus:'720 190 46 70',sunflower:'520 180 60 160'}[ri.id];
  return `<svg viewBox="${box}">${ri.svg()}</svg>`;
}
function priceOf(id){ const x=ALL_BUY().find(i=>i.id===id); return x?x.price:0; }
function nameOf(id){ const x=ALL_BUY().find(i=>i.id===id); return x?x.name:''; }

/* ---------- rendering ---------- */
function renderBar(){
  document.getElementById('bar').innerHTML=`
    <div class="kids">${KIDS.map(k=>{ const st=load(k.id); return `<button class="kid" data-act="kid" data-v="${k.id}" aria-pressed="${k.id===kidId}"><span class="av">${st.chosen?drawChar(st.animal,st.worn):drawChar('cat')}</span>${k.name}</button>`; }).join('')}</div>

function shopHtml(){
  const cats = side==='home' ? ROOM_CATS : WEAR_CATS;
  if(!cats.some(c=>c.id===tab)) tab=cats[0].id;
  let list;
  if(tab==='wallpaper') list=WALLPAPERS.map(w=>({id:w.id,name:w.name,price:w.price,cat:'wallpaper'}));
  else if(['furniture','wall','plant'].includes(tab)) list=ROOM_ITEMS.filter(i=>i.cat===tab);
  else list=ITEMS.filter(i=>i.cat===tab);
  const cards=list.map(i=>{
    const own = i.price===0 || isOwned(i.id), can=S.coins>=i.price, isWp=tab==='wallpaper', isWear=side==='animal';
    const on = isWp ? S.wallpaper===i.id : isWear ? S.worn[i.cat]===i.id : own;
    let act='';
    if(own){
      if(isWp) act = on ? '<span class="need">על הקיר</span>' : `<button class="btn primary" data-act="useWp" data-v="${i.id}">לשים על הקיר</button>`;
      else if(isWear) act=`<button class="btn ${on?'':'primary'}" data-act="wear" data-v="${i.id}">${on?'להוריד':'ללבוש'}</button>`;
      else act='<span class="need">בחדר</span>';
    } else act=`<button class="btn" data-act="preview" data-v="${i.id}">${preview===i.id?'מסתכלת עכשיו':'לראות'}</button><button class="btn primary" data-act="buy" data-v="${i.id}" ${can?'':'disabled'}>לקנות</button>${can?'':`<span class="need">עוד ${i.price-S.coins} מטבעות</span>`}`;
    return `<div class="item ${on?'on':''} ${preview===i.id?'pv':''}"><div class="th">${thumb(i.id)}</div><b>${i.name}</b>${own?'':`<span class="price">${COIN}${i.price}</span>`}${act}</div>`;
  }).join('');
  return `<section class="card"><h2>החנות</h2>
    <div class="seg"><button data-act="side" data-v="home" aria-pressed="${side==='home'}">לבית</button><button data-act="side" data-v="animal" aria-pressed="${side==='animal'}">ל${ANIMALS[S.animal].name}</button></div>
    <div class="tabs" role="tablist">${cats.map(c=>`<button class="tab" role="tab" aria-selected="${tab===c.id}" data-act="tab" data-v="${c.id}">${c.name}</button>`).join('')}</div>
    <div class="grid">${cards}</div></section>`;
}
function practiceHtml(){
  const bars=[1,2,3,4,5].map(n=>`<i class="${n<=S.level?'on':''}"></i>`).join('');
  let body;
  if(S.pendingChallenge) body=`<div class="chcard"><div><span class="chtag">⭐ שאלת אתגר</span></div><p style="margin:0">שאלה קשה במיוחד. מי שפותרת, גם עם רמז, מקבלת תיבת הפתעה.</p>
      <div class="row"><button class="btn primary" data-act="takeCh">לנסות!</button><button class="btn" data-act="skipCh">לא עכשיו</button></div></div>`;
  else { const q=S.challenge||S.q, run=T.running;
    body=`${S.challenge?'<div style="text-align:center"><span class="chtag">⭐ שאלת אתגר</span></div>':''}
      <div class="q ltr ${S.challenge?'ch':''}">${q.a} + ${q.b}</div>
      <div class="ans"><button class="say" data-act="say" aria-label="להקריא">${IC.speaker}</button><input id="ans" inputmode="numeric" autocomplete="off" aria-label="התשובה"><button class="btn primary" data-act="check">בדיקה</button></div>
      ${S.challenge?'':`<div class="row"><button class="sw ${run?'run':''}" data-act="sw" aria-label="סטופר">${run?IC.pause:IC.watch}<span id="swt">${T.ms||run?fmt(ms()):'סטופר'}</span></button></div>
      <p class="best">${S.best[S.level]!=null?`השיא שלך ברמה הזאת: ${fmt(S.best[S.level])}. שוברים שיא: תיבת הפתעה.`:'אפשר להפעיל סטופר ולקבוע שיא אישי.'}</p>`}`; }
  return `<section class="card practice"><h2>תרגול בונוס</h2><p class="meta">כל תרגיל מוסיף מטבעות. התרגילים נהיים קשים יותר כשהולך טוב.</p>
    <div class="level"><span>רמה ${S.level}: ${LEVELS[S.level].name}</span><span class="bars" aria-hidden="true">${bars}</span></div>
    ${body}${msg?`<p class="msg ${msg.ok?'ok':''}">${msg.text}</p>`:''}</section>`;
}
function render(){
  document.documentElement.style.setProperty('--accent','#7444C9');
  renderBar();
  if(!S.chosen){
    document.getElementById('app').innerHTML='';
    document.getElementById('overlay').innerHTML=`<div class="scrim"><div class="modal"><h2>שלום ${KIDS.find(k=>k.id===kidId).name}! איזו חיה תגור איתך?</h2><p class="meta">עוד חיות יצטרפו אחרי כל שיעור.</p>
      <div class="starters">${STARTERS.map(a=>`<button data-act="start" data-v="${a}">${drawChar(a)}${ANIMALS[a].name}</button>`).join('')}</div></div></div>`; return;
  }
  const friends=S.animals.filter(a=>a!==S.animal);
  const anim=ANIMAL_ORDER.map(a=>{ const has=S.animals.includes(a); return `<button class="an ${has?'':'locked'}" ${has?`data-act="animal" data-v="${a}"`:'disabled'} aria-pressed="${S.animal===a}">${drawChar(a)}<span>${has?ANIMALS[a].name:'אחרי שיעור'}</span></button>`; }).join('');
  document.getElementById('app').innerHTML=`
    <div class="col">

      <section class="card"><h2>החיות שלי</h2><p class="meta">כל שיעור שמסיימים מביא חיה חדשה לגור בבית. לחיצה על חיה הופכת אותה לראשית.</p><div class="animals" style="margin-top:8px">${anim}</div></section>

  document.getElementById('overlay').innerHTML=ov;
  const inp=document.getElementById('ans'); if(inp && !modal) inp.focus({preventScroll:true});

/* ---------- actions ---------- */
function grant(id){
  if(WALLPAPERS.some(w=>w.id===id)){ (S.ownedWp ||= []).push(id); S.wallpaper=id; }
  else { S.items.push(id); const it=itemById(id); if(it && ['outfit','hair','hat','glasses'].includes(it.cat)) S.worn[it.cat]=id; }
}
const A={
  kid(v){ save(); kidId=v; S=load(v); preview=null; msg=null; modal=null; Object.assign(T,{ms:0,from:null,running:false,used:false}); if(S.chosen && !S.q && !S.pendingChallenge && !S.challenge) nextQ(); save(); },
  start(v){ S.chosen=true; S.animal=v; S.animals=[v]; nextQ(); save(); },
  side(v){ side=v; preview=null; tab = v==='home' ? 'wallpaper' : 'outfit'; },
  tab(v){ tab=v; },
  preview(v){ preview = preview===v ? null : v; window.scrollTo({top:0,behavior:'smooth'}); },
  buy(v){ const p=priceOf(v); if(S.coins<p) return; S.coins-=p; grant(v); preview=null; msg={ok:true,text:`קנית: ${nameOf(v)}!`}; save(); },
  useWp(v){ S.wallpaper=v; save(); },
  wear(v){ const it=itemById(v); S.worn[it.cat] = S.worn[it.cat]===v ? undefined : v; save(); },
  animal(v){ S.animal=v; save(); },
  sw(){ if(T.running){ T.ms+=Date.now()-T.from; T.from=null; T.running=false; } else { T.from=Date.now(); T.running=true; T.used=true; } },
  check(){ check(); return false; },
  say(){ const q=S.challenge||S.q; if(q) speak(`כמה זה ${q.a} ועוד ${q.b}?`); return false; },
  takeCh(){ const [a,b]=CHALLENGES[r(0,CHALLENGES.length-1)]; S.challenge={a,b,wrong:0,level:5}; S.pendingChallenge=false; msg=null; save(); },
  skipCh(){ S.pendingChallenge=false; const [a,b]=LEVELS[S.level].gen(); S.q={a,b,wrong:0,level:S.level}; msg=null; save(); },
  pick(v){ grant(v); offer=null; modal=`<div class="th" style="width:200px;height:170px">${thumb(v)}</div><h2>${nameOf(v)}!</h2><p class="meta">זה שלך עכשיו${ITEMS.some(i=>i.id===v&&['outfit','hair','hat','glasses'].includes(i.cat))?', וכבר על החיה':', וכבר בבית'}.</p>`; save(); },
  close(){ modal=null; },
  lessons(){ modal='<h2>לשיעורים</h2><p class="meta">כאן תיפתח מפת השיעורים. בגרסת הניסיון היא עוד לא מחוברת.</p>'; },
  simLesson(){ const next=ANIMAL_ORDER.find(a=>!S.animals.includes(a)); if(!next){ modal='<h2>כל החיות כבר בבית!</h2>'; return; } S.animals.push(next); save();
    modal=`<h2>סיימת שיעור!</h2>${drawChar(next).replace('<svg','<svg style="width:170px;height:204px"')}<p><b>${ANIMALS[next].name}</b> עוברת לגור אצלך בבית!</p>`; },
  reset(){ S=fresh(); save(); preview=null; msg=null; modal=null; }
