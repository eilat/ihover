<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מתמטיקידס · הבית של החיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700&display=swap">
<style>
/* הבית של החיה: the character lives in a room. Coins buy pets and objects that fill the room,
   and clothes for the character. New animals move in as friends. Signature: the room filling up. */
:root{--bg:#E6F0EC;--surface:#fff;--ink:#17312B;--muted:#4E6560;--line:#C8D9D3;--accent:#0B7570;--coin:#D99A06;--coin-soft:#FFF1C7;--good:#1F7A4D;--good-soft:#DDF2E7;
  --wall:#F3E9DD;--floor:#BFD6CB;--f-display:"Secular One","Heebo",system-ui,sans-serif;--f-body:"Heebo",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1A17;--surface:#172420;--ink:#E3F0EC;--muted:#93ABA4;--line:#2A3E38;--coin-soft:#3A3018;--good:#3FB37A;--good-soft:#1C3A2B;--wall:#2B3437;--floor:#33493F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A17;--surface:#172420;--ink:#E3F0EC;--muted:#93ABA4;--line:#2A3E38;--coin-soft:#3A3018;--good:#3FB37A;--good-soft:#1C3A2B;--wall:#2B3437;--floor:#33493F;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate}
.coin{width:22px;height:22px;vertical-align:-5px}
.wrap{max-width:1160px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.bank{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;background:var(--coin-soft);padding:6px 16px;border-radius:999px}
.room{border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:var(--wall)}
.room svg.scene{display:block;width:100%;height:auto}
.friend{cursor:pointer}
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
.card{background:var(--surface);border-radius:18px;padding:18px;border:1.5px solid var(--line);min-width:0}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px}
.meta{color:var(--muted);font-size:14px;margin:0}
.practice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.practice .q{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.practice input{font:inherit;font-family:var(--f-display);font-size:28px;width:130px;height:56px;text-align:center;border:3px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--ink)}
.btn{min-height:48px;padding:6px 20px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{padding:8px 14px;border-radius:12px;background:var(--coin-soft);margin:10px 0 0}
.msg.ok{background:var(--good-soft)}
.say{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.say svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.it{border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;text-align:center;background:var(--surface)}
.it svg{width:84px;height:100px}
.it.on{border-color:var(--good);background:var(--good-soft)}
.it .p{display:flex;align-items:center;gap:3px;font-weight:700}
.it .p svg.coin{width:20px;height:20px}
.it .btn{min-height:38px;padding:2px 10px;font-size:14px;width:100%}
.need{font-size:12px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);display:grid;place-items:center;z-index:9;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.modal svg{width:170px;height:204px}
.placed{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:900px){.below{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
/* Shared art + logic for the three reward prototypes.
   A character = an animal + one worn item per category. All parts share one geometry
   (viewBox 0 0 200 240, head centre 100,100 r58, body centre 100,188), so every item fits every animal. */

const ANIMALS = {
  cat:     {name:'חתולה',     fur:'#E8A25B', light:'#F7D9B5', dark:'#B86E2C'},
  bunny:   {name:'ארנבת',     fur:'#E9E4E0', light:'#FFFFFF', dark:'#B9AEA8'},
  fox:     {name:'שועלה',     fur:'#E07B39', light:'#FFF4E8', dark:'#5A3420'},
  bear:    {name:'דובה',      fur:'#A8754F', light:'#E6C7A6', dark:'#6E4A30'},
  panda:   {name:'פנדה',      fur:'#F6F5F1', light:'#FFFFFF', dark:'#2B2B2E', body:'#2B2B2E'},
  owl:     {name:'ינשופה',    fur:'#9C7457', light:'#F1E4D1', dark:'#6B4A35'},
  dino:    {name:'דינוזאורית', fur:'#6CC08B', light:'#DDF3C9', dark:'#3E8E5D'},
  unicorn: {name:'חד־קרן',    fur:'#EFE2FA', light:'#FFFFFF', dark:'#C9B8DA'},
  squirrel:{name:'סנאית',     fur:'#C8743A', light:'#F3D6B4', dark:'#8A4B1F'}
};
const ANIMAL_ORDER = ['cat','bunny','fox','bear','panda','owl','dino','unicorn','squirrel'];

/* parts drawn behind the body and head: tails, spikes, mane */
function backSvg(a, A){
  if(a==='squirrel') return `<path d="M140 226 Q206 222 196 150 Q190 104 150 96 Q176 120 168 150 Q160 182 132 196Z" fill="${A.fur}"/><path d="M150 210 Q192 200 186 154 Q182 126 160 112 Q174 136 168 160 Q162 186 142 200Z" fill="${A.light}" opacity=".55"/>`;
  if(a==='dino') return `<path d="M140 214 Q196 214 204 176 Q184 196 148 192Z" fill="${A.fur}"/>
    <g fill="${A.dark}"><path d="M70 50 L80 26 L90 46Z"/><path d="M90 44 L100 18 L110 44Z"/><path d="M110 46 L120 26 L130 50Z"/><path d="M130 56 L144 40 L146 64Z"/></g>`;
  if(a==='unicorn') return `<path d="M128 52 Q170 60 166 110 Q176 140 156 162 Q150 128 136 104Z" fill="#C89BF0"/><path d="M134 66 Q160 80 156 116 Q164 136 150 150 Q146 120 136 100Z" fill="#7FC8F8"/><path d="M140 82 Q154 98 148 126" stroke="#FF9EC7" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  return '';
}
function earsSvg(a, A){
  if(a==='cat') return `<path d="M50 78 L58 26 L94 54 Z" fill="${A.fur}"/><path d="M150 78 L142 26 L106 54 Z" fill="${A.fur}"/><path d="M60 66 L63 40 L82 55 Z" fill="#F4A9B8"/><path d="M140 66 L137 40 L118 55 Z" fill="#F4A9B8"/>`;
  if(a==='bunny') return `<ellipse cx="74" cy="30" rx="15" ry="42" fill="${A.fur}" transform="rotate(-10 74 30)"/><ellipse cx="126" cy="30" rx="15" ry="42" fill="${A.fur}" transform="rotate(10 126 30)"/><ellipse cx="74" cy="32" rx="7" ry="30" fill="#F4B8C4" transform="rotate(-10 74 32)"/><ellipse cx="126" cy="32" rx="7" ry="30" fill="#F4B8C4" transform="rotate(10 126 32)"/>`;
  if(a==='fox') return `<path d="M46 84 L50 18 L96 52 Z" fill="${A.fur}"/><path d="M154 84 L150 18 L104 52 Z" fill="${A.fur}"/><path d="M50 30 L52 18 L64 28 Z M150 30 L148 18 L136 28 Z" fill="${A.dark}"/>`;
  if(a==='bear') return `<circle cx="56" cy="56" r="22" fill="${A.fur}"/><circle cx="144" cy="56" r="22" fill="${A.fur}"/><circle cx="56" cy="56" r="11" fill="${A.light}"/><circle cx="144" cy="56" r="11" fill="${A.light}"/>`;
  if(a==='panda') return `<circle cx="56" cy="54" r="21" fill="${A.dark}"/><circle cx="144" cy="54" r="21" fill="${A.dark}"/>`;
  if(a==='owl') return `<path d="M52 70 L50 30 L82 52Z" fill="${A.dark}"/><path d="M148 70 L150 30 L118 52Z" fill="${A.dark}"/>`;
  if(a==='unicorn') return `<path d="M56 70 L60 34 L86 54Z" fill="${A.fur}"/><path d="M144 70 L140 34 L114 54Z" fill="${A.fur}"/><path d="M63 62 L65 44 L78 55Z M137 62 L135 44 L122 55Z" fill="#F4B8D8"/>`;
  if(a==='squirrel') return `<path d="M54 74 L58 30 L86 54Z" fill="${A.fur}"/><path d="M146 74 L142 30 L114 54Z" fill="${A.fur}"/><path d="M58 30 L52 18 M58 30 L62 16 M142 30 L148 18 M142 30 L138 16" stroke="${A.dark}" stroke-width="4" stroke-linecap="round"/>`;
  return ''; // dino: no ears
}
function faceSvg(a, A){
  const eyes = (r=7) => `<circle cx="78" cy="100" r="${r}" fill="#2A2225"/><circle cx="122" cy="100" r="${r}" fill="#2A2225"/><circle cx="${78+r*.35}" cy="${100-r*.35}" r="${r*.34}" fill="#fff"/><circle cx="${122+r*.35}" cy="${100-r*.35}" r="${r*.34}" fill="#fff"/>`;
  const cheeks = `<ellipse cx="66" cy="117" rx="8" ry="5" fill="#F29BA8" opacity=".6"/><ellipse cx="134" cy="117" rx="8" ry="5" fill="#F29BA8" opacity=".6"/>`;
  const mouth = `<path d="M100 118 L100 124 M92 126 Q100 132 108 126" stroke="#3B2A2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const nose = c => `<path d="M94 113 Q100 119 106 113 Q100 110 94 113Z" fill="${c}"/>`;
  if(a==='owl') return `<circle cx="78" cy="98" r="19" fill="${A.light}"/><circle cx="122" cy="98" r="19" fill="${A.light}"/>${eyes(9)}
    <path d="M92 112 L100 128 L108 112Z" fill="#F2A33A"/>${cheeks}`;
  if(a==='panda') return `<ellipse cx="76" cy="102" rx="15" ry="12" fill="${A.dark}" transform="rotate(-25 76 102)"/><ellipse cx="124" cy="102" rx="15" ry="12" fill="${A.dark}" transform="rotate(25 124 102)"/>
    <circle cx="78" cy="100" r="6" fill="#fff"/><circle cx="122" cy="100" r="6" fill="#fff"/><circle cx="78" cy="100" r="3.6" fill="#2A2225"/><circle cx="122" cy="100" r="3.6" fill="#2A2225"/>
    ${cheeks}${nose('#2A2225')}${mouth}`;
  if(a==='dino') return `<ellipse cx="100" cy="124" rx="30" ry="18" fill="${A.light}"/>${eyes(7)}${cheeks}
    <circle cx="92" cy="116" r="2.4" fill="${A.dark}"/><circle cx="108" cy="116" r="2.4" fill="${A.dark}"/>
    <path d="M86 128 Q100 138 114 128" stroke="#2F5D41" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const muzzle = a==='fox' ? `<path d="M62 112 Q100 160 138 112 Q120 104 100 108 Q80 104 62 112Z" fill="${A.light}"/>`
               : a==='bear' ? `<ellipse cx="100" cy="122" rx="26" ry="19" fill="${A.light}"/>`
               : a==='squirrel' ? `<ellipse cx="100" cy="122" rx="24" ry="17" fill="${A.light}"/>`
               : a==='cat' ? `<ellipse cx="100" cy="122" rx="22" ry="15" fill="${A.light}"/>` : '';
  const whisk = a==='cat'||a==='bunny' ? `<path d="M70 120 L46 116 M70 126 L46 128 M130 120 L154 116 M130 126 L154 128" stroke="${A.dark}" stroke-width="2" stroke-linecap="round"/>` : '';
  const teeth = a==='squirrel' ? `<rect x="96" y="127" width="8" height="7" rx="1.5" fill="#fff" stroke="#3B2A2A" stroke-width="1.2"/>` : '';
  return `${muzzle}${eyes(7)}${cheeks}${nose(a==='bunny'||a==='unicorn'?'#E58AA0':'#3B2A2A')}${mouth}${teeth}${whisk}`;
}
/* parts drawn on top of the head: horn, forelock */
function headExtrasSvg(a, A){
  if(a==='unicorn') return `<path d="M100 8 L90 50 L110 50Z" fill="#F7C948" stroke="#E0A800" stroke-width="2" stroke-linejoin="round"/><path d="M92 40 L108 34 M94 28 L106 24" stroke="#E0A800" stroke-width="2.4"/>
    <path d="M80 50 Q96 40 112 50 Q100 60 86 64Z" fill="#FF9EC7"/>`;
  if(a==='owl') return `<path d="M62 76 Q78 68 92 78 M108 78 Q122 68 138 76" stroke="${A.dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  return '';
}
/* body details */
function bodySvg(a, A){
  const body=A.body||A.fur;
  let s=`<ellipse cx="100" cy="190" rx="54" ry="48" fill="${body}"/><ellipse cx="100" cy="198" rx="32" ry="30" fill="${a==='panda'?'#F6F5F1':A.light}" opacity=".95"/>`;
  if(a==='owl') s+=`<path d="M48 176 Q40 214 70 230 Q62 200 66 172Z M152 176 Q160 214 130 230 Q138 200 134 172Z" fill="${A.dark}"/><path d="M86 188 q4 4 8 0 M106 188 q4 4 8 0 M96 204 q4 4 8 0 M86 218 q4 4 8 0 M106 218 q4 4 8 0" stroke="${A.dark}" stroke-width="2" fill="none"/>`;
  if(a==='dino') s+=`<g fill="${A.dark}" opacity=".5"><circle cx="64" cy="186" r="6"/><circle cx="140" cy="200" r="5"/><circle cx="132" cy="176" r="4"/></g>`;
  return s;
}

/* ---- items: [category, id, name, price, svg(A) or {back, front}] ---- */
const CATS = [
  {id:'outfit', name:'בגדים'}, {id:'hair', name:'תסרוקות'}, {id:'hat', name:'כובעים'},
  {id:'glasses', name:'משקפיים'}, {id:'pet', name:'חיות מחמד'}, {id:'object', name:'חפצים'}
];
const ITEMS = [
  // clothes (drawn on the body)
  {cat:'outfit', id:'stripes', name:'חולצת פסים', price:4, svg:()=>`<path d="M52 170 Q100 150 148 170 L152 214 Q100 232 48 214Z" fill="#3E7BD8"/><path d="M50 182 Q100 166 150 182 M49 196 Q100 182 151 196 M49 210 Q100 198 151 210" stroke="#fff" stroke-width="6" fill="none"/>`},
  {cat:'outfit', id:'dress', name:'שמלה', price:6, svg:()=>`<path d="M60 166 Q100 154 140 166 L146 186 L160 228 Q100 242 40 228 L54 186Z" fill="#E8577E"/><circle cx="80" cy="206" r="4" fill="#fff"/><circle cx="104" cy="214" r="4" fill="#fff"/><circle cx="126" cy="202" r="4" fill="#fff"/><circle cx="92" cy="186" r="4" fill="#fff"/><circle cx="118" cy="184" r="4" fill="#fff"/>`},
  {cat:'outfit', id:'cape', name:'גלימה', price:8, svg:{back:()=>`<path d="M40 156 Q100 138 160 156 L176 236 Q100 226 24 236Z" fill="#7B4BC9"/>`, front:()=>`<path d="M66 156 L100 172 L134 156" stroke="#F2B21E" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="100" cy="172" r="7" fill="#F2B21E"/>`}},
  {cat:'outfit', id:'overalls', name:'אוברול', price:5, svg:()=>`<path d="M58 186 L142 186 L150 224 Q100 238 50 224Z" fill="#2F9E8F"/><path d="M70 160 L74 190 M130 160 L126 190" stroke="#2F9E8F" stroke-width="9" stroke-linecap="round"/><rect x="86" y="194" width="28" height="18" rx="4" fill="#257E72"/>`},
  // hair (on the head, between the ears)
  {cat:'hair', id:'bangs', name:'פוני', price:3, svg:()=>`<path d="M54 82 Q60 40 100 40 Q140 40 146 82 Q132 64 120 74 Q110 58 100 72 Q88 58 80 74 Q68 62 54 82Z" fill="#4A2E22"/>`},
  {cat:'hair', id:'curls', name:'תלתלים', price:4, svg:()=>`<g fill="#D9783A"><circle cx="70" cy="56" r="14"/><circle cx="88" cy="46" r="15"/><circle cx="108" cy="44" r="15"/><circle cx="126" cy="50" r="14"/><circle cx="138" cy="64" r="12"/><circle cx="60" cy="70" r="11"/></g>`},
  {cat:'hair', id:'pony', name:'קוקו', price:5, svg:()=>`<path d="M60 70 Q70 42 100 42 Q130 42 140 70 Q120 56 100 58 Q80 56 60 70Z" fill="#2E2A33"/><path d="M150 70 Q186 76 178 130 Q170 110 154 100Z" fill="#2E2A33"/><circle cx="152" cy="74" r="7" fill="#E8457A"/>`},
  {cat:'hair', id:'tuft', name:'ציצית', price:2, svg:()=>`<path d="M96 46 Q86 22 104 18 Q96 30 108 34 Q104 24 118 26 Q106 38 104 48Z" fill="#6B3E26"/>`},
  // hats
  {cat:'hat', id:'crown', name:'כתר', price:10, svg:()=>`<path d="M66 50 L72 18 L88 38 L100 12 L112 38 L128 18 L134 50Z" fill="#F2C230" stroke="#C99A12" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="36" r="5" fill="#E8457A"/><circle cx="80" cy="42" r="4" fill="#3E7BD8"/><circle cx="120" cy="42" r="4" fill="#3E7BD8"/>`},
  {cat:'hat', id:'beanie', name:'כובע צמר', price:5, svg:()=>`<path d="M48 62 Q52 18 100 16 Q148 18 152 62Z" fill="#E05A47"/><rect x="44" y="56" width="112" height="16" rx="8" fill="#F5F0E6"/><circle cx="100" cy="12" r="11" fill="#F5F0E6"/>`},
  {cat:'hat', id:'straw', name:'כובע קש', price:6, svg:()=>`<ellipse cx="100" cy="54" rx="80" ry="14" fill="#E8C66A"/><path d="M62 54 Q66 16 100 16 Q134 16 138 54Z" fill="#E8C66A"/><path d="M63 46 Q100 54 137 46 L138 54 Q100 60 62 54Z" fill="#3E9C6B"/>`},
  {cat:'hat', id:'bow', name:'פפיון', price:3, svg:()=>`<path d="M118 48 L100 36 L102 62Z M118 48 L136 36 L134 62Z" fill="#E8457A"/><circle cx="118" cy="49" r="7" fill="#C72F63"/>`},
  // glasses
  {cat:'glasses', id:'round', name:'משקפיים עגולים', price:4, svg:()=>`<g fill="none" stroke="#2A2225" stroke-width="4"><circle cx="78" cy="100" r="15"/><circle cx="122" cy="100" r="15"/><path d="M93 98 Q100 94 107 98"/></g>`},
  {cat:'glasses', id:'hearts', name:'משקפי לב', price:6, svg:()=>`<g fill="#F06292" fill-opacity=".55" stroke="#D81B60" stroke-width="3.5"><path d="M78 116 L62 100 Q58 86 70 86 Q76 86 78 92 Q80 86 86 86 Q98 86 94 100Z"/><path d="M122 116 L106 100 Q102 86 114 86 Q120 86 122 92 Q124 86 130 86 Q142 86 138 100Z"/></g><path d="M94 96 Q100 92 106 96" stroke="#D81B60" stroke-width="3" fill="none"/>`},
  {cat:'glasses', id:'stars', name:'משקפי כוכב', price:7, svg:()=>{ const st=(x,y)=>`<path d="M${x} ${y-17} L${x+5} ${y-5} L${x+17} ${y-4} L${x+8} ${y+5} L${x+11} ${y+17} L${x} ${y+10} L${x-11} ${y+17} L${x-8} ${y+5} L${x-17} ${y-4} L${x-5} ${y-5}Z"/>`; return `<g fill="#FFD54F" fill-opacity=".7" stroke="#E0A800" stroke-width="3" stroke-linejoin="round">${st(78,100)}${st(122,100)}</g><path d="M94 98 Q100 94 106 98" stroke="#E0A800" stroke-width="3" fill="none"/>`; }},
  {cat:'glasses', id:'shades', name:'משקפי שמש', price:5, svg:()=>`<g fill="#263238"><rect x="60" y="90" width="34" height="20" rx="8"/><rect x="106" y="90" width="34" height="20" rx="8"/></g><path d="M94 96 L106 96" stroke="#263238" stroke-width="4"/><path d="M66 95 L76 95" stroke="#fff" stroke-width="3" opacity=".6" stroke-linecap="round"/>`},
  // pets (bottom corner)
  {cat:'pet', id:'chick', name:'אפרוח', price:6, svg:()=>`<g transform="translate(0 0)"><ellipse cx="34" cy="222" rx="20" ry="16" fill="#FFD54F"/><circle cx="34" cy="198" r="13" fill="#FFD54F"/><circle cx="30" cy="196" r="2.4" fill="#2A2225"/><path d="M20 198 L13 201 L20 203Z" fill="#F59E0B"/><path d="M40 222 Q48 216 50 224" stroke="#F2B21E" stroke-width="3" fill="none"/></g>`},
  {cat:'pet', id:'snail', name:'חילזון', price:5, svg:()=>`<path d="M8 234 Q40 238 64 232 Q60 222 50 224 L18 226Z" fill="#A5D6A7"/><circle cx="40" cy="214" r="18" fill="#C68B59"/><path d="M40 214 m-10 0 a10 10 0 1 1 10 10 a6 6 0 1 1 -6 -6" stroke="#8D5A35" stroke-width="3" fill="none"/><path d="M14 226 L8 210 M20 226 L18 210" stroke="#7CB342" stroke-width="3" stroke-linecap="round"/><circle cx="8" cy="208" r="3" fill="#2A2225"/><circle cx="18" cy="208" r="3" fill="#2A2225"/>`},

  // objects (held on the right)
  {cat:'object', id:'balloon', name:'בלון', price:3, svg:()=>`<path d="M176 92 Q170 140 154 176" stroke="#555" stroke-width="2" fill="none"/><ellipse cx="178" cy="62" rx="20" ry="25" fill="#E8457A"/><path d="M172 87 L184 87 L178 94Z" fill="#E8457A"/><ellipse cx="171" cy="54" rx="5" ry="8" fill="#fff" opacity=".45"/>`},

  {cat:'object', id:'ball', name:'כדור', price:2, svg:()=>`<circle cx="174" cy="218" r="17" fill="#42A5F5"/><path d="M157 218 Q174 206 191 218 M174 201 Q166 218 174 235" stroke="#fff" stroke-width="4" fill="none"/>`},
  {cat:'object', id:'flower', name:'פרח', price:4, svg:()=>`<path d="M162 186 L170 132" stroke="#43A047" stroke-width="5" stroke-linecap="round"/><g fill="#FF8AB3"><circle cx="170" cy="112" r="9"/><circle cx="184" cy="122" r="9"/><circle cx="180" cy="138" r="9"/><circle cx="162" cy="138" r="9"/><circle cx="157" cy="122" r="9"/></g><circle cx="170" cy="126" r="8" fill="#FFD54F"/>`}

const itemById = id => ITEMS.find(i=>i.id===id);
const LAYER_ORDER = ['outfit','hair','hat','glasses','object','pet'];

/* draw one character. worn = {cat: itemId}. preview = {cat: itemId} overrides (for "try on") */
function drawChar(animal, worn={}, preview={}){
  const A = ANIMALS[animal], w = {...worn, ...preview};
  const it = c => w[c] ? itemById(w[c]) : null;
  const part = (item, side) => !item ? '' : typeof item.svg === 'function' ? (side==='front' ? item.svg(A) : '') : (item.svg[side] ? item.svg[side](A) : '');
  const out = it('outfit');
  return `<svg viewBox="-6 -18 216 260" role="img" aria-label="${A.name}">
    ${part(out,'back')}
    ${backSvg(animal, A)}
    ${bodySvg(animal, A)}
    ${part(out,'front')}
    ${animal==='fox' ? `<path d="M144 206 Q186 190 182 156 Q170 176 150 186Z" fill="${A.fur}"/><path d="M178 160 Q184 168 181 176 Q174 170 170 168Z" fill="#fff"/>` : ''}
    ${animal==='bunny' ? `<circle cx="150" cy="214" r="12" fill="#fff"/>` : ''}
    ${earsSvg(animal, A)}
    <circle cx="100" cy="100" r="58" fill="${A.fur}"/>
    ${faceSvg(animal, A)}
    ${headExtrasSvg(animal, A)}
    ${part(it('hair'),'front')}${part(it('hat'),'front')}${part(it('glasses'),'front')}${part(it('object'),'front')}${part(it('pet'),'front')}
  </svg>`;
}

/* ---- earning: a mini lesson of 5 mental-addition questions ---- */
const QUESTIONS = [[300,400],[60,30],[432,251],[253,172],[50,70]];
const STARS_PER = 3, LESSON_LEN = QUESTIONS.length;
const HINTS = {
  '300+400':'3 מאות ועוד 4 מאות. כמה מאות זה?',
  '60+30':'6 עשרות ועוד 3 עשרות.',
  '432+251':'מאות: 400 + 200. עשרות: 30 + 50. אחדות: 2 + 1.',
  '253+172':'מאות: 200 + 100. עשרות: 50 + 70 = 120. אחדות: 3 + 2.',
  '50+70':'5 + 7 = 12, אז 50 + 70 = 120.'
};

function loadState(key){
  const fresh = {animal:'cat', animals:['cat'], items:[], worn:{}, stars:10, lessons:0, q:0, wrong:0, gifts:0};
  try{ const s = JSON.parse(localStorage.getItem(key)||'null'); return s ? {...fresh, ...s} : fresh; }catch(e){ return fresh; }
}
function saveState(key, s){ try{ localStorage.setItem(key, JSON.stringify(s)); }catch(e){} }

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = x => `<span class="ltr">${x}</span>`;
const STAR = '<svg viewBox="0 0 24 24" class="star" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
let VOICE=null;
function pickVoice(){ try{ const he=speechSynthesis.getVoices().filter(v=>/^he|^iw/i.test(v.lang)); const s=v=>(/premium/i.test(v.name)?4:0)+(/enhanced/i.test(v.name)?3:0); VOICE=he.sort((a,b)=>s(b)-s(a))[0]||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){}
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='he-IL'; if(VOICE) u.voice=VOICE; u.rate=.9; speechSynthesis.speak(u);}catch(e){} }

/* answer a question; returns {ok, stars, lessonDone, unlocked} */
function answer(S, value){
  const [x,y] = QUESTIONS[S.q];
  if(+value !== x+y){ S.wrong++; return {ok:false, hint: S.wrong>=2 ? HINTS[`${x}+${y}`] : 'עוד לא. נסי שוב, את יכולה.'}; }
  S.stars += STARS_PER; S.wrong = 0; S.q++;
  let lessonDone=false, unlocked=null;
  if(S.q >= LESSON_LEN){
    S.q = 0; S.lessons++; lessonDone = true;
    const next = ANIMAL_ORDER.find(a => !S.animals.includes(a));
    if(next){ S.animals.push(next); unlocked = next; }
  }
  return {ok:true, stars:STARS_PER, lessonDone, unlocked};
}

const KEY='rw3'; const S=loadState(KEY); let shopTab='room', msg=null, modal=null, justPlaced=null;
const SPEAK='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
const COIN='<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F2C230" stroke="#C99A12" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#C99A12" stroke-width="1.6"/></svg>';
const ROOM_CATS=['pet','object'], WEAR_CATS=['outfit','hair','hat','glasses'];
/* item art alone, cropped out of the character frame */
const crop = id => { const i=itemById(id); const vb = i.cat==='pet' ? '0 180 72 62' : '140 20 70 222';
  return `<svg viewBox="${vb}">${typeof i.svg==='function'?i.svg(ANIMALS[S.animal]):''}</svg>`; };
const FRIEND_SPOTS=[[604,184,96],[700,196,90],[16,190,90],[112,204,80],[206,196,84],[520,236,74],[236,244,70],[650,252,70]];
const PET_SPOTS=[[60,300],[640,318],[170,336],[540,340]], OBJ_SPOTS=[[150,96],[600,90],[90,150],[690,140]];
function scene(){
  const owned = S.items.map(itemById);
  const pets = owned.filter(i=>i.cat==='pet'), objs = owned.filter(i=>i.cat==='object');
  const placeSvg=(i,[x,y],w,h,vb)=>`<svg class="${justPlaced===i.id?'placed':''}" x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb}">${i.svg(ANIMALS[S.animal])}</svg>`;
  const friends = S.animals.filter(a=>a!==S.animal).map((a,k)=>`<g class="friend" data-act="animal" data-v="${a}" role="button" aria-label="לעבור ל${ANIMALS[a].name}"><svg x="${FRIEND_SPOTS[k][0]}" y="${FRIEND_SPOTS[k][1]}" width="${FRIEND_SPOTS[k][2]}" height="${FRIEND_SPOTS[k][2]*1.2}" viewBox="-6 -18 216 260">${drawChar(a,{}).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg></g>`).join('');
  const main = drawChar(S.animal, Object.fromEntries(Object.entries(S.worn).filter(([c])=>WEAR_CATS.includes(c)))).replace(/^<svg[^>]*>|<\/svg>$/g,'');
  return `<svg class="scene" viewBox="0 0 800 420" role="img" aria-label="החדר של ה${ANIMALS[S.animal].name}">
    <rect width="800" height="300" fill="var(--wall)"/>
    <path d="M0 300 H800 V420 H0Z" fill="var(--floor)"/>
    <path d="M0 300 H800" stroke="rgba(0,0,0,.12)" stroke-width="4"/>
    <path d="M0 340 H800 M0 382 H800" stroke="rgba(0,0,0,.06)" stroke-width="3"/>
    <rect x="300" y="40" width="200" height="130" rx="10" fill="#BFE3F5" stroke="#fff" stroke-width="10"/>
    <path d="M400 40 V170 M300 105 H500" stroke="#fff" stroke-width="6"/>
    <circle cx="460" cy="78" r="16" fill="#FFE082"/>
    <rect x="120" y="190" width="150" height="10" rx="4" fill="#A9825B"/><rect x="560" y="200" width="150" height="10" rx="4" fill="#A9825B"/>
    <ellipse cx="400" cy="372" rx="190" ry="34" fill="color-mix(in srgb,var(--accent) 35%,#fff)" opacity=".8"/>
    ${objs.map((i,k)=>placeSvg(i,OBJ_SPOTS[k%4],70,222*.62,'140 20 70 222')).join('')}
    <svg x="300" y="110" width="200" height="240" viewBox="-6 -18 216 260">${main}</svg>
    ${friends}
    ${pets.map((i,k)=>`<ellipse cx="${PET_SPOTS[k%4][0]+45}" cy="${PET_SPOTS[k%4][1]+74}" rx="38" ry="7" fill="rgba(0,0,0,.14)"/>`+placeSvg(i,PET_SPOTS[k%4],90,78,'0 180 72 62')).join('')}
    ${!owned.length?`<text x="400" y="404" text-anchor="middle" font-size="18" fill="var(--muted)" font-family="Heebo">החדר עוד ריק. אפשר לקנות חיות מחמד וחפצים.</text>`:''}
  </svg>`;
}
function render(){
  const [x,y]=QUESTIONS[S.q];
  const cats = shopTab==='room' ? ROOM_CATS : WEAR_CATS;
  const items = ITEMS.filter(i=>cats.includes(i.cat)).map(i=>{
    const has=S.items.includes(i.id), on=S.worn[i.cat]===i.id, can=S.stars>=i.price, room=ROOM_CATS.includes(i.cat);
    const art = room ? crop(i.id) : drawChar(S.animal,{},{[i.cat]:i.id});
    let act;
    if(has) act = room ? `<span class="need">בחדר</span>` : `<button class="btn ${on?'':'primary'}" data-act="wear" data-v="${i.id}">${on?'להוריד':'ללבוש'}</button>`;
    else act = `<button class="btn primary" data-act="buy" data-v="${i.id}" ${can?'':'disabled'}>לקנות</button>${can?'':`<span class="need">עוד ${i.price-S.stars}</span>`}`;
    return `<div class="it ${on?'on':''}">${art}<span>${i.name}</span>${has?'':`<span class="p">${COIN}${i.price}</span>`}${act}</div>`;
  }).join('');
  const locked = ANIMAL_ORDER.filter(a=>!S.animals.includes(a)).length;
  document.getElementById('app').innerHTML=`
  <div class="top"><h1>הבית של ה${ANIMALS[S.animal].name}</h1><div class="bank" aria-label="מטבעות">${COIN}<span class="ltr">${S.stars}</span></div></div>
  <div class="room">${scene()}</div>
  <p class="meta">${S.animals.length>1?'לחיצה על חברה בחדר מחליפה את החיה הראשית. ':''}${locked?`עוד ${locked} חיות יעברו לגור כאן, אחת אחרי כל שיעור.`:'כל החיות כבר גרות כאן!'}</p>
  <div class="below">
    <section class="card">
      <h2>מרוויחות מטבעות</h2>
      <p class="meta">תרגיל ${S.q+1} מתוך ${LESSON_LEN}. כל תרגיל שפותרים: ${STARS_PER} מטבעות, גם עם רמז.</p>
      <div class="practice"><button class="say" data-act="say" aria-label="להקריא">${SPEAK}</button><span class="q ltr">${x} + ${y} =</span><input id="ans" inputmode="numeric" autocomplete="off" aria-label="התשובה"><button class="btn primary" data-act="check">בדיקה</button></div>
      ${msg?`<p class="msg ${msg.ok?'ok':''}">${msg.text}</p>`:''}
    </section>
    <section class="card">
      <h2>החנות</h2>
      <div class="seg"><button data-act="shop" data-v="room" aria-pressed="${shopTab==='room'}">לחדר: חיות מחמד וחפצים</button><button data-act="shop" data-v="wear" aria-pressed="${shopTab==='wear'}">בגדים, תסרוקות, כובעים, משקפיים</button></div>
      <div class="shop">${items}</div>
    </section>
  </div>
  ${modal?`<div class="scrim"><div class="modal" role="dialog">${modal}<button class="btn primary" data-act="close">איזה כיף!</button></div></div>`:''}`;
  const inp=document.getElementById('ans'); if(inp && !modal) inp.focus({preventScroll:true});
  justPlaced=null;
}
function check(){
  const v=document.getElementById('ans').value.trim(); if(!v) return;
  const r=answer(S,v);
  if(!r.ok){ msg={text:r.hint}; render(); return; }
  msg={ok:true,text:`נכון! קיבלת ${STARS_PER} מטבעות.`};
  if(r.lessonDone) modal = r.unlocked ? `<h2>סיימת שיעור!</h2>${drawChar(r.unlocked)}<p><b>${ANIMALS[r.unlocked].name}</b> עוברת לגור אצלך בחדר!</p>` : `<h2>סיימת שיעור!</h2>`;
  saveState(KEY,S); render();
}
const A={
  shop(v){ shopTab=v; },
  buy(v){ const i=itemById(v); if(S.stars<i.price) return; S.stars-=i.price; S.items.push(v);
    if(WEAR_CATS.includes(i.cat)) S.worn[i.cat]=v; else justPlaced=v;
    msg={ok:true,text: ROOM_CATS.includes(i.cat) ? `${i.name}: עכשיו בחדר!` : `קנית ${i.name}!`}; saveState(KEY,S); },
  wear(v){ const i=itemById(v); S.worn[i.cat] = S.worn[i.cat]===v ? undefined : v; saveState(KEY,S); },
  animal(v){ S.animal=v; saveState(KEY,S); },
  check(){ check(); return false; },
  say(){ const [x,y]=QUESTIONS[S.q]; speak(`כמה זה ${x} ועוד ${y}?`); return false; },
  close(){ modal=null; }
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; if(A[t.dataset.act]?.(t.dataset.v)!==false) render(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='ans'){ e.preventDefault(); check(); } if(e.key==='Escape' && modal){ modal=null; render(); } });
render();
</script></body></html>
