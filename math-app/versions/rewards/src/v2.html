<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מתמטיקידס · תיבת הפתעה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Varela+Round&display=swap">
<style>
/* תיבת הפתעה: stars fill a jar; a full jar opens a surprise box with 3 items to choose from.
   An album shows everything, with silhouettes for what is still hidden. Signature: the box opening. */
:root{--bg:#E8F1F8;--surface:#fff;--ink:#1D2840;--muted:#56657E;--line:#CFD9E6;--accent:#2F7FC1;--gold:#E0A800;--gold-soft:#FFF4CC;--good:#1F7A4D;--good-soft:#DDF2E7;
  --f-display:"Fredoka","Varela Round",system-ui,sans-serif;--f-body:"Varela Round","Fredoka",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111827;--surface:#1A2336;--ink:#EAF0FA;--muted:#9DABC2;--line:#2D3A54;--gold-soft:#3C3320;--good:#3FB37A;--good-soft:#1C3A2B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--surface:#1A2336;--ink:#EAF0FA;--muted:#9DABC2;--line:#2D3A54;--gold-soft:#3C3320;--good:#3FB37A;--good-soft:#1C3A2B;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate}
.star{width:22px;height:22px;fill:var(--gold);vertical-align:-4px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.card{background:var(--surface);border-radius:26px;padding:24px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;margin:0;font-size:24px}
.meta{color:var(--muted);font-size:15px;margin:0}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
/* hero: character + jar */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:20px;align-items:center}
.charbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.charbox svg{width:min(280px,100%);height:auto}
.who{font-family:var(--f-display);font-size:26px;font-weight:600}
.jar{display:flex;flex-direction:column;align-items:center;gap:10px}
.glass{width:120px;height:170px;border:5px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-top-width:12px;border-radius:20px 20px 36px 36px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.fill{position:absolute;inset:auto 0 0 0;background:linear-gradient(#FFE082,#F2B21E);transition:height .6s}
.jarstars{position:absolute;inset:0;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;gap:2px;padding:6px;justify-content:center}
.jarstars .star{width:22px;height:22px;fill:#fff;opacity:.9}
.jarlbl{font-family:var(--f-display);font-weight:600;font-size:20px}
.openbtn{min-height:56px;padding:8px 22px;border-radius:999px;border:0;background:var(--gold);color:#3A2B00;font-family:var(--f-display);font-weight:600;font-size:20px;box-shadow:0 6px 0 #B98A00;animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
/* practice */
.practice{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.practice .q{font-family:var(--f-display);font-weight:600;font-size:38px;font-variant-numeric:tabular-nums}
.practice input{font:inherit;font-family:var(--f-display);font-size:32px;width:150px;height:62px;text-align:center;border:3px solid var(--accent);border-radius:16px;background:var(--surface);color:var(--ink)}
.btn{min-height:52px;padding:8px 24px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:500;font-size:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.msg{padding:10px 16px;border-radius:16px;background:var(--gold-soft);margin:12px 0 0}
.msg.ok{background:var(--good-soft)}
.say{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.say svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
/* album */
.album h3{font-family:var(--f-display);font-weight:500;margin:16px 0 8px;font-size:18px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{border-radius:18px;border:2px dashed var(--line);padding:6px;display:flex;flex-direction:column;align-items:center;font-size:14px;min-height:150px;background:var(--surface)}
.slot svg{width:90px;height:108px}
.slot.got{border-style:solid;border-color:var(--line)}
.slot.on{border-color:var(--good);background:var(--good-soft)}
.slot.hidden svg{filter:brightness(0);opacity:.13}
.slot.hidden span{color:var(--muted)}
/* animals */
.animals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.an{padding:6px;border-radius:18px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;font-size:15px}
.an svg{width:100px;height:120px}
.an[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.an.locked{cursor:default;color:var(--muted)} .an.locked svg{filter:brightness(0);opacity:.15}
/* surprise box modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;z-index:9;padding:16px}
.modal{background:var(--surface);border-radius:28px;padding:28px;max-width:720px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.gift{width:150px;height:150px;animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
.choice{border:3px solid var(--line);border-radius:20px;padding:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.choice:nth-child(2){animation-delay:.12s}.choice:nth-child(3){animation-delay:.24s}
.choice:hover{border-color:var(--accent)}
.choice svg{width:130px;height:156px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.modal .big svg{width:180px;height:216px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
/*COMMON*/
const KEY='rw2', BOX=9; const S=loadState(KEY); let msg=null, modal=null, offer=null;
const SPEAK='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
const GIFT=`<svg class="gift" viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="40" width="76" height="52" rx="6" fill="#E8457A"/><rect x="6" y="28" width="88" height="18" rx="5" fill="#F06292"/><rect x="44" y="28" width="12" height="64" fill="#FFD54F"/><path d="M50 28 C38 8 18 14 30 26 Z M50 28 C62 8 82 14 70 26 Z" fill="#FFD54F"/></svg>`;
function render(){
  const [x,y]=QUESTIONS[S.q], inJar=Math.min(S.stars,BOX);
  const jarStars = Array.from({length:inJar},()=>STAR).join('');
  const album = CATS.map(c=>`<h3>${c.name}</h3><div class="row">${ITEMS.filter(i=>i.cat===c.id).map(i=>{
      const got=S.items.includes(i.id), on=S.worn[i.cat]===i.id;
      return got ? `<button class="slot got ${on?'on':''}" data-act="wear" data-v="${i.id}" aria-pressed="${on}">${drawChar(S.animal,{},{[i.cat]:i.id})}<span>${i.name}${on?' · עלייך':''}</span></button>`
                 : `<div class="slot hidden" aria-label="פריט שעוד לא נמצא">${drawChar(S.animal,{},{[i.cat]:i.id})}<span>?</span></div>`;
    }).join('')}</div>`).join('');
  const anim = ANIMAL_ORDER.map(a=>{ const has=S.animals.includes(a);
    return `<button class="an ${has?'':'locked'}" ${has?`data-act="animal" data-v="${a}"`:'disabled'} aria-pressed="${S.animal===a}">${drawChar(a, has?S.worn:{})}<span>${has?ANIMALS[a].name:'נפתחת בשיעור הבא'}</span></button>`; }).join('');
  const found=S.items.length;
  document.getElementById('app').innerHTML=`
  <div class="col">
    <section class="card">
      <div class="hero">
        <div class="charbox">${drawChar(S.animal,S.worn)}<div class="who">${ANIMALS[S.animal].name}</div></div>
        <div class="jar" aria-label="צנצנת הכוכבים">
          <div class="glass"><div class="fill" style="height:${inJar/BOX*100}%"></div><div class="jarstars">${jarStars}</div></div>
          <div class="jarlbl ltr">${inJar} / ${BOX}</div>
          ${S.stars>=BOX?`<button class="openbtn" data-act="open">לפתוח תיבה!</button>${S.stars>BOX?`<p class="meta">ועוד ${S.stars-BOX} כוכבים מחכים לתיבה הבאה</p>`:''}`:`<p class="meta">עוד ${BOX-S.stars} כוכבים לתיבה</p>`}
        </div>
      </div>
    </section>
    <section class="card">
      <h2>מרוויחות כוכבים</h2>
      <p class="meta">תרגיל ${S.q+1} מתוך ${LESSON_LEN}. כל תרגיל שפותרים: ${STARS_PER} כוכבים, גם עם רמז.</p>
      <div class="practice"><button class="say" data-act="say" aria-label="להקריא">${SPEAK}</button><span class="q ltr">${x} + ${y} =</span><input id="ans" inputmode="numeric" autocomplete="off" aria-label="התשובה"><button class="btn primary" data-act="check">בדיקה</button></div>
      ${msg?`<p class="msg ${msg.ok?'ok':''}">${msg.text}</p>`:''}
    </section>
    <section class="card album">
      <h2>האלבום שלי</h2><p class="meta">מצאת ${found} מתוך ${ITEMS.length}. לחיצה על פריט שמצאת מלבישה או מורידה אותו.</p>
      ${album}
    </section>
  </div>
  <aside class="col"><section class="card"><h2>החיות שלי</h2><p class="meta">כל שיעור שמסיימים פותח חיה חדשה.</p><div class="animals" style="margin-top:12px">${anim}</div></section></aside>
  ${modal?`<div class="scrim"><div class="modal" role="dialog">${modal}</div></div>`:''}`;
  const inp=document.getElementById('ans'); if(inp && !modal) inp.focus({preventScroll:true});
}
function boxModal(){
  return `${GIFT}<h2>מה יש בתיבה?</h2><p class="meta">בחרי אחד. השאר יחכו לתיבות הבאות.</p>
    <div class="choices">${offer.map(id=>{ const i=itemById(id); return `<button class="choice" data-act="pick" data-v="${id}">${drawChar(S.animal,{},{[i.cat]:id})}<b>${i.name}</b></button>`; }).join('')}</div>`;
}
function check(){
  const v=document.getElementById('ans').value.trim(); if(!v) return;
  const r=answer(S,v);
  if(!r.ok){ msg={text:r.hint}; render(); return; }
  msg={ok:true,text:`נכון! ${STARS_PER} כוכבים נכנסו לצנצנת.`};
  if(r.lessonDone) modal = r.unlocked ? `<h2>סיימת שיעור!</h2><div class="big">${drawChar(r.unlocked)}</div><p>נפתחה לך חיה חדשה: <b>${ANIMALS[r.unlocked].name}</b>.</p><button class="btn primary" data-act="close">איזה כיף!</button>` : `<h2>סיימת שיעור!</h2><button class="btn primary" data-act="close">איזה כיף!</button>`;
  saveState(KEY,S); render();
}
const A={
  open(){ if(S.stars<BOX) return; const left=ITEMS.filter(i=>!S.items.includes(i.id)).map(i=>i.id);
    if(!left.length){ msg={ok:true,text:'מצאת כבר את כל הפריטים! איזה אוסף.'}; return; }
    offer=left.sort(()=>Math.random()-.5).slice(0,3); S.stars-=BOX; saveState(KEY,S); modal=boxModal(); },
  pick(v){ const i=itemById(v); S.items.push(v); S.worn[i.cat]=v; offer=null; saveState(KEY,S);
    modal=`<h2>${i.name}!</h2><div class="big">${drawChar(S.animal,S.worn)}</div><p>עכשיו זה באלבום, וכבר על ה${ANIMALS[S.animal].name}.</p><button class="btn primary" data-act="close">יופי!</button>`; },
  wear(v){ const i=itemById(v); S.worn[i.cat] = S.worn[i.cat]===v ? undefined : v; saveState(KEY,S); },
  animal(v){ S.animal=v; saveState(KEY,S); },
  check(){ check(); return false; },
  say(){ const [x,y]=QUESTIONS[S.q]; speak(`כמה זה ${x} ועוד ${y}?`); return false; },
  close(){ modal=null; }
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; if(A[t.dataset.act]?.(t.dataset.v)!==false) render(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='ans'){ e.preventDefault(); check(); } if(e.key==='Escape' && modal && !offer){ modal=null; render(); } });
render();
</script></body></html>
