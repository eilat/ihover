<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מתמטיקידס · הבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Assistant:wght@400;600&display=swap">
<style>
/* הבית: a separate screen from the lessons. The room is the hero; a shop with tabs for the home and for
   the animal; bonus practice on the side that gets harder gradually; a surprise box for a personal record
   or a challenge question. */
:root{--bg:#EEF1F4;--surface:#fff;--ink:#1E2633;--muted:#5A6577;--line:#D3DAE3;--accent:#7444C9;--coin:#D99A06;--coin-soft:#FFF1C7;--good:#1F7A4D;--good-soft:#DDF2E7;--hint:#FFF1C9;
  --f-display:"Rubik",system-ui,sans-serif;--f-body:"Assistant","Rubik",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12161D;--surface:#1B212B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2E3746;--coin-soft:#3A3018;--good:#3FB37A;--good-soft:#1C3A2B;--hint:#3D3420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161D;--surface:#1B212B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2E3746;--coin-soft:#3A3018;--good:#3FB37A;--good-soft:#1C3A2B;--hint:#3D3420;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ltr{direction:ltr;unicode-bidi:isolate}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.coin{width:22px;height:22px;vertical-align:-5px;flex:none}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1.5px solid var(--line)}
.kids{display:flex;gap:8px}
.kid{display:flex;align-items:center;gap:8px;min-height:48px;padding:3px 14px 3px 4px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:17px}
.kid[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.kid .av{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--accent) 15%,var(--surface));overflow:hidden;display:grid;place-items:center}
.kid .av svg{width:46px;height:56px;margin-top:10px}
.title{flex:1;text-align:center;font-family:var(--f-display);font-size:22px;font-weight:600}
.bank{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:22px;background:var(--coin-soft);padding:6px 16px;border-radius:999px}
.tolessons{display:flex;align-items:center;gap:6px;min-height:48px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600}
/* layout */
.wrap{max-width:1480px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px minmax(0,1fr) 280px;gap:16px;align-items:stretch;flex:1;min-height:0;width:100%}
@media (min-width:1181px) and (min-height:600px){body{height:100vh;display:flex;flex-direction:column;overflow:hidden}.bar{flex:none}}
/* three columns, nothing on the page scrolls: the shop (right) scrolls inside itself, the home stays in the middle */
.shop{display:flex;flex-direction:column;min-height:0;padding-bottom:0}
.shop .scroll{flex:1;min-height:0;overflow:auto;padding:2px 2px 16px;margin:0 -2px}
.mid{min-height:0}
.mid .room{flex:1;min-height:260px}
.room{position:relative}
.mid .room svg.scene{height:100%}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:8px 18px;border-radius:999px;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.16);font-weight:600;animation:drop .35s ease both}
.banner.ok{background:var(--good);color:#fff}
.banner .preview-tag{background:var(--accent)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.06);min-width:0}
h2{font-family:var(--f-display);font-size:21px;margin:0 0 6px}
.meta{color:var(--muted);font-size:14px;margin:0}
.room{border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.room svg.scene{display:block;width:100%;height:auto}
.friend{cursor:pointer}
.curtain{cursor:pointer}
svg.arranging g.ent{cursor:grab}
svg.arranging g.ent:active{cursor:grabbing}
.roomtools{position:absolute;top:12px;inset-inline-start:12px;z-index:2;display:flex;gap:8px;flex-wrap:wrap}
/* her animals: small round faces along the bottom of the room (the room keeps nearly all the height) */
.anrow{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:6px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;padding:6px 8px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.anrow::-webkit-scrollbar{display:none}
.anc{flex:none;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center;overflow:hidden}
.anc svg{width:44px;height:44px;display:block}
.anc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.anc:disabled{cursor:default;background:var(--bg)} .anc:disabled svg{filter:brightness(0);opacity:.2}
/* the shop can fold away: then the home takes its place */
.wrap.noshop{grid-template-columns:64px minmax(0,1fr) 280px}
.shoprail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;border:0;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600;color:var(--accent);align-self:start}
.shoprail svg.ic{width:28px;height:28px}
.shophead{display:flex;align-items:center;gap:8px}.shophead h2{margin:0;flex:1}
.shopx{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.shopx:hover{border-color:var(--accent);color:var(--accent)}
/* secondary tabs: one row that scrolls sideways */
.chips{display:flex;align-items:center;gap:4px;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid var(--line)}
.chips .tabs{flex:1;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0;border:0;scroll-behavior:smooth}
.chips .tabs::-webkit-scrollbar{display:none}
.chips .tab{flex:none;white-space:nowrap}
.carr{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.carr svg.ic{width:18px;height:18px}
/* price tiers */
.tier{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px}
.tier.rare{background:#E3F2FD;color:#1565C0}.tier.legend{background:#FFF3C4;color:#8A6100}
.item.rare{border-color:#90CAF9}.item.legend{border-color:#F2C230;background:linear-gradient(180deg,#FFFBEA,var(--surface) 40%)}
/* recolour: the first change is a gift, each new colour after that costs 5, colours she bought stay hers */
.pal{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:4px}
.pc{position:relative;width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);background:var(--c);padding:0;font-size:12px;line-height:1;color:var(--muted)}
.pc.on{box-shadow:0 0 0 2.5px var(--ink)}
.pc.orig{background:var(--surface)}
.pc i{position:absolute;top:-7px;inset-inline-end:-7px;font-style:normal;font-size:9px;font-weight:700;background:#F2C230;color:#5A4300;border-radius:999px;padding:0 3px}
.rt{min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.rt.wide{padding:0 16px}.rt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rt[aria-pressed="true"]{background:#1E2A5A;border-color:#1E2A5A;color:#FFF3C4}
.card.hide{display:none}
.arrange .arr-row{justify-content:flex-start;align-items:center;margin-top:8px}
.arrange .btn{min-height:42px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{border-style:dashed;color:var(--muted);margin-inline-start:auto}
.store{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.stbtn{flex:none;width:84px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;font-size:12px}
.stbtn .th{width:70px;height:56px}
.stbtn:hover{border-color:var(--accent)}
.preview-tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
/* animals */
/* shop */
.seg{display:flex;gap:6px;margin:6px 0 10px}
.seg button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid var(--line)}
.tab{min-height:42px;padding:4px 16px;border-radius:999px;border:2px solid transparent;background:transparent;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item.on{border-color:var(--good);background:var(--good-soft)}
.item.pv{border-color:var(--accent)}
.th{width:110px;height:96px;display:grid;place-items:center;overflow:hidden}
.th svg{max-width:100%;max-height:100%}
.item b{font-size:15px}
.price{display:flex;align-items:center;gap:4px;font-weight:600}
.item .btn{min-height:38px;padding:3px 12px;font-size:14px;width:100%}
.acts{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;margin-top:2px}
.ib{min-height:44px;border-radius:999px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-family:var(--f-display);font-weight:600;font-size:17px}
.ib.eye{width:44px;padding:0;color:var(--muted)}
.ib.eye[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ib.buy{background:var(--accent);border-color:var(--accent);color:#fff}
.ib.buy .coin{width:18px;height:18px}
.ib:disabled{opacity:.45;cursor:default}
.ib:not(:disabled):hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.need{font-size:12px;color:var(--muted)}
.btn{min-height:48px;padding:6px 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
/* bonus practice */
.practice{overflow:auto;min-height:0}
.level{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:14px;color:var(--muted)}
.bars{display:flex;gap:4px;direction:ltr}
.bars i{width:14px;height:10px;border-radius:3px;background:var(--line)}
.bars i.on{background:var(--accent)}
.q{font-family:var(--f-display);font-weight:600;font-size:40px;text-align:center;font-variant-numeric:tabular-nums}
.q.ch{color:var(--coin)}
.ans{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0}
.ans input{font:inherit;font-family:var(--f-display);font-size:30px;width:120px;height:58px;text-align:center;border:3px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;min-height:42px;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.sw.run{border-color:var(--accent);color:var(--accent)}
.best{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
.msg{padding:10px 14px;border-radius:12px;background:var(--hint);margin-top:10px}
.msg.ok{background:var(--good-soft)}
.chcard{border:2px dashed var(--coin);background:var(--coin-soft);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chtag{display:inline-block;background:var(--coin);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;margin-bottom:4px}
.say{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
/* modals */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;z-index:9;padding:16px}
.modal{background:var(--surface);border-radius:24px;padding:24px;max-width:700px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.modal h2{font-size:26px}
.gift{width:130px;height:130px;animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.choice{border:3px solid var(--line);border-radius:18px;padding:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.choice:nth-child(2){animation-delay:.1s}.choice:nth-child(3){animation-delay:.2s}
.choice:hover{border-color:var(--accent)}
.choice .th{width:140px;height:120px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.starters{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.starters button{border:3px solid var(--line);border-radius:18px;background:var(--surface);padding:8px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:20px;font-weight:600}
.starters button:hover{border-color:var(--accent)}
.starters svg{width:130px;height:156px}
.testbar{padding:0 4px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.testbar button{font-size:13px;min-height:34px;padding:2px 12px;border-radius:999px;border:1.5px dashed var(--line);background:transparent;color:var(--muted)}
/*SHELL_CSS*/
@media (max-width:1180px){.mid .room{flex:none;aspect-ratio:800/560;min-height:0}.anc{width:40px;height:40px}.anc svg{width:38px;height:38px}.wrap{grid-template-columns:340px minmax(0,1fr)}.wrap.noshop{grid-template-columns:64px minmax(0,1fr)}.shop{grid-row:span 2;max-height:calc(100vh - 101px);position:sticky;top:16px}.practice{grid-column:2}}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.shop{grid-row:auto;max-height:70vh;position:static}.practice{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="bar" id="bar"></header>
<div class="wrap" id="app"></div>
<div id="overlay"></div>
<script>
/*SHELL*/
/*CHARACTERS*/
/*ROOM*/
/*GIRL*/
const COIN='<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F2C230" stroke="#C99A12" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#C99A12" stroke-width="1.6"/></svg>';
const IC={
  watch:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4M12 2v3"/></svg>',
  pause:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>',
  speaker:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>',
  next:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  prev:'<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  eye:'<svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  sun:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  move:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>',
  brush:'<svg class="ic" viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H6v-6z"/><path d="M12 6l6 6"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  flip:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7l-5 5 5 5V7zM16 7l5 5-5 5V7z"/></svg>',
  box:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',
  bag:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>'
};
const GIFT=`<svg class="gift" viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="40" width="76" height="52" rx="6" fill="#E8457A"/><rect x="6" y="28" width="88" height="18" rx="5" fill="#F06292"/><rect x="44" y="28" width="12" height="64" fill="#FFD54F"/><path d="M50 28 C38 8 18 14 30 26 Z M50 28 C62 8 82 14 70 26 Z" fill="#FFD54F"/></svg>`;
const STARTERS=['cat','bunny','fox'];
const FACE=Shell.kid()?.face||'lili';

/* ---------- state per girl ---------- */
const kidId=Shell.kid()?.id;
function fresh(){ return {chosen:false, animal:'cat', animals:[], wallpaper:'wp-plain', items:[], worn:{}, wornBy:{}, girlWorn:{}, pos:{}, stored:[], colors:{}, shopOpen:true, night:false, curtain:'cu-pink', curtainOpen:true, floor:'fl-wood', ownedFloor:[], ownedCurtain:[], coins:12, level:1, streak:0, best:{}, qn:0, q:null, challenge:null, pendingChallenge:false}; }
/* every animal has its own clothes (wornBy); S.worn is the main animal's, kept in step on load, save and switch */
function load(id){ let s; try{ s=JSON.parse(localStorage.getItem('home:'+id)||'null'); }catch(e){} s=s?{...fresh(),...s}:fresh();
  s.wornBy ||= {}; if(!Object.keys(s.wornBy).length && Object.keys(s.worn||{}).length) s.wornBy[s.animal]=s.worn; // from before
  s.worn=s.wornBy[s.animal] ||= {}; return s; }
const tsNow=()=>{ try{ return +(localStorage.getItem('mk:ts:home:'+kidId)||0); }catch(e){ return 0; } };
let seenTs=0;
function save(){ try{ S.girlColors=Object.fromEntries(Object.entries(colorMap()).filter(([id])=>id.startsWith('g-'))); // the style page dresses her in these colours
  localStorage.setItem('home:'+kidId, JSON.stringify(S)); seenTs=tsNow(); }catch(e){} }
function refresh(){ if(tsNow()>seenTs){ S=load(kidId); seenTs=tsNow(); return true; } return false; }
let S=load(kidId); seenTs=tsNow();
let arrange=false, sel=null, drag=null;
let side='home', tab='wallpaper', lastTab=null, lastSide=null, preview=null, msg=null, banner=null, bannerT=0, modal=null, offer=null;
const T={ms:0,from:null,running:false,used:false};

/* ---------- bonus practice: 5 difficulty levels, up after 2 in a row, down after a hard time ---------- */
const LEVELS=[null,

    document.getElementById('app').innerHTML='';
    document.getElementById('overlay').innerHTML=`<div class="scrim"><div class="modal"><h2>שלום ${Shell.esc(Shell.kid().name)}! איזו חיה תגור איתך?</h2><p class="meta">עוד חיות יצטרפו אחרי כל נושא שמסיימים.</p>
      <div class="starters">${STARTERS.map(a=>`<button data-act="start" data-v="${a}">${drawChar(a)}${ANIMALS[a].name}</button>`).join('')}</div></div></div>`; return;
  }
  const friends=S.animals.filter(a=>a!==S.animal);
  const face=a=>drawChar(a,a===S.animal?S.worn:(S.wornBy[a]||{}),{},colorMap()).replace(/viewBox="[^"]*"/,'viewBox="18 -14 164 172"');
  const anim=ANIMAL_ORDER.map(a=>{ const has=S.animals.includes(a); return `<button class="anc" ${has?`data-act="animal" data-v="${a}" title="${ANIMALS[a].name}" aria-label="${ANIMALS[a].name}"`:'disabled title="אחרי נושא" aria-label="נפתחת אחרי נושא"'} aria-pressed="${S.animal===a}">${face(a)}</button>`; }).join('');
  // keep where she was in the shop, the chips and the animals row: re-rendering must not move anything under her finger
  const keep={shop:tab===lastTab?document.querySelector('.shop .scroll')?.scrollTop:0, an:document.querySelector('.anrow')?.scrollLeft, chips:side===lastSide?document.querySelector('.chips .tabs')?.scrollLeft:0}; lastTab=tab; lastSide=side;
  const app=document.getElementById('app'); app.classList.toggle('noshop',!S.shopOpen);
  app.innerHTML=`
    ${S.shopOpen?shopHtml():`<button class="shoprail" data-act="shop" aria-label="לפתוח את החנות" title="לפתוח את החנות">${IC.bag}<span>חנות</span></button>`}
    <div class="col mid">
      <div class="room">${banner?`<p class="banner ok" role="status">${banner}</p>`:preview?`<p class="banner"><span class="preview-tag">מסתכלת</span> ככה זה ייראה</p>`:''}${roomSvg({animal:S.animal, worn:S.worn, wornBy:S.wornBy, wallpaper:S.wallpaper, items:S.items, friends, preview, girl:{face:FACE, worn:S.girlWorn, look:LOOK()},
        pos:S.pos, stored:S.stored, arrange, sel, night:S.night, curtain:S.curtain, curtainOpen:S.curtainOpen, floor:S.floor, colors:colorMap()})}${roomTools()}
        ${arrange?'':`<div class="anrow" role="group" aria-label="החיות שלי. כל נושא שמסיימים מביא חיה חדשה">${anim}</div>`}</div>
      ${arrange?arrangePanel():''}
    </div>
    <aside class="col practice">${practiceHtml()}${Shell.kid()?.trial?`<div class="testbar">לבדיקה בלבד: <button data-act="simLesson">סיימתי שיעור (פותח חיה חדשה)</button><button data-act="reset">להתחיל את הבית מחדש</button></div>`:''}</aside>`;
  fitRoom();
  const sc=document.querySelector('.shop .scroll'); if(sc) sc.scrollTop=keep.shop||0;
  const an=document.querySelector('.anrow'); if(an && keep.an!=null) an.scrollLeft=keep.an;
  const ch=document.querySelector('.chips .tabs'); if(ch && keep.chips!=null){ ch.style.scrollBehavior='auto'; ch.scrollLeft=keep.chips; ch.style.scrollBehavior=''; }
  let ov='';
  if(modal==='box') ov=`<div class="scrim"><div class="modal" role="dialog">${GIFT}<h2>תיבת הפתעה!</h2><p class="meta">בחרי מתנה אחת.</p><div class="choices">${offer.map(id=>`<button class="choice" data-act="pick" data-v="${id}"><div class="th">${thumb(id)}</div><b>${nameOf(id)}</b></button>`).join('')}</div></div></div>`;
  else if(modal) ov=`<div class="scrim"><div class="modal" role="dialog">${modal}<button class="btn primary" data-act="close">איזה כיף!</button></div></div>`;
  document.getElementById('overlay').innerHTML=ov;
  const inp=document.getElementById('ans'); if(inp && !modal) inp.focus({preventScroll:true});
}

/* ---------- actions ---------- */
function grant(id){
  if(WALLPAPERS.some(w=>w.id===id)){ (S.ownedWp ||= []).push(id); S.wallpaper=id; }
  else if(FLOORS.some(f=>f.id===id)){ (S.ownedFloor ||= []).push(id); S.floor=id; }
  else if(CURTAINS.some(c=>c.id===id)){ (S.ownedCurtain ||= []).push(id); S.curtain=id; }
  else if(girlItem(id)){ S.items.push(id); S.girlWorn[girlItem(id).cat]=id; }
  else { S.items.push(id); const it=itemById(id); if(it && ['outfit','hair','hat','glasses'].includes(it.cat)) S.worn[it.cat]=id; }
}
const A={
  start(v){ S.chosen=true; S.animal=v; S.animals=[v]; S.worn=S.wornBy[v] ||= {};
    // lessons finished before the home existed: their animals move in now
    const n=S.pendingAnimals||0; S.pendingAnimals=0; const came=ANIMAL_ORDER.filter(a=>a!==v).slice(0,n); S.animals.push(...came);
    if(came.length) welcome(came[came.length-1]);
    nextQ(); save(); },
  side(v){ side=v; preview=null; tab = v==='home' ? 'wallpaper' : v==='me' ? 'g-outfit' : 'outfit'; },
  tab(v){ tab=v; },
  preview(v){ preview = preview===v ? null : v; },
  chipScroll(v){ const t=document.querySelector('.chips .tabs'); if(t) t.scrollBy({left:-v*160}); return false; },
  shop(){ S.shopOpen=!S.shopOpen; preview=null; save(); },
  recolor(v){ const [id,c0]=v.split('|'), c=c0||null; const e=(S.colors ||= {})[id] ||= {c:null,owned:[],freeUsed:false};
    if((e.c||null)===c) return;
    if(c===null||e.owned.includes(c)){ e.c=c; save(); return; }
    if(!e.freeUsed){ e.freeUsed=true; e.owned.push(c); e.c=c; save(); flash('הצבע הראשון במתנה!'); return; }
    if(S.coins<RECOLOR_PRICE){ flash(`צבע חדש עולה ${RECOLOR_PRICE} מטבעות. עוד קצת תרגול!`); return; }
    S.coins-=RECOLOR_PRICE; e.owned.push(c); e.c=c; save(); flash(`צבע חדש! ${RECOLOR_PRICE} מטבעות, והוא שלך.`); },
  buy(v){ const p=priceOf(v); if(S.coins<p) return; S.coins-=p; grant(v); preview=null; save();
    // the news goes on top of the home, where the new thing just appeared, and fades by itself
    flash(`קנית: ${nameOf(v)}!`); },
  useWp(v){ S.wallpaper=v; save(); },
  useFloor(v){ S.floor=v; save(); },
  useCurtain(v){ S.curtain=v; save(); },
  curtain(){ S.curtainOpen=!S.curtainOpen; save(); },
  night(){ S.night=!S.night; save(); },
  arrange(){ arrange=!arrange; sel=null; preview=null; },
  flip(){ if(!sel) return; const p=S.pos[sel] ||= {}; p.flip=!p.flip; save(); },
  store(){ if(!sel||sel==='main'||sel==='girl') return; S.stored=[...(S.stored||[]),sel]; sel=null; save(); },
  unstore(v){ S.stored=(S.stored||[]).filter(x=>x!==v); sel=v; save(); },
  resetPos(){ S.pos={}; S.stored=[]; sel=null; save(); },
  wear(v){ const it=itemById(v); S.worn[it.cat] = S.worn[it.cat]===v ? undefined : v; save(); },
  wearMe(v){ const c=girlItem(v).cat; S.girlWorn[c] = S.girlWorn[c]===v ? undefined : v; save(); },
  animal(v){ S.wornBy[S.animal]=S.worn; S.animal=v; S.worn=S.wornBy[v] ||= {}; save(); },
  sw(){ if(T.running){ T.ms+=Date.now()-T.from; T.from=null; T.running=false; } else { T.from=Date.now(); T.running=true; T.used=true; } },
  check(){ check(); return false; },
  say(){ const q=S.challenge||S.q; if(q) speak(`כמה זה ${q.a} ועוד ${q.b}?`); return false; },
  takeCh(){ const [a,b]=newChallenge(); S.challenge={a,b,wrong:0,level:5}; S.pendingChallenge=false; msg=null; save(); },
  skipCh(){ S.pendingChallenge=false; const [a,b]=LEVELS[S.level].gen(); S.q={a,b,wrong:0,level:S.level}; msg=null; save(); },
  pick(v){ grant(v); offer=null; modal=`<div class="th" style="width:200px;height:170px">${thumb(v)}</div><h2>${nameOf(v)}!</h2><p class="meta">זה שלך עכשיו${girlItem(v)?', וכבר עלייך':ITEMS.some(i=>i.id===v&&['outfit','hair','hat','glasses'].includes(i.cat))?', וכבר על החיה':', וכבר בבית'}.</p>`; save(); },
  close(){ modal=null; },
  simLesson(){ if(!Shell.kid()?.trial) return; const next=ANIMAL_ORDER.find(a=>!S.animals.includes(a)); if(!next){ modal='<h2>כל החיות כבר בבית!</h2>'; return; } S.animals.push(next); save();
    modal=`<h2>סיימת נושא!</h2>${drawChar(next).replace('<svg','<svg style="width:170px;height:204px"')}<p><b>${ANIMALS[next].name}</b> עוברת לגור אצלך בבית!</p>`; },
  reset(){ if(!Shell.kid()?.trial) return; S=fresh(); save(); preview=null; msg=null; modal=null; }
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; if(refresh()){ render(); return; } if(A[t.dataset.act]?.(t.dataset.v)!==false) render(); });
document.addEventListener('keydown',e=>{ if(Shell.isOpen()) return; if(e.key==='Enter' && e.target.id==='ans'){ e.preventDefault(); check(); } if(e.key==='Escape' && modal && modal!=='box'){ modal=null; render(); } });
function welcome(a){ modal=`<h2>יש לך שותפה חדשה בבית!</h2>${drawChar(a).replace('<svg','<svg style="width:170px;height:204px"')}<p><b>${ANIMALS[a].name}</b> עברה לגור אצלך, כי סיימת נושא שלם.</p>`; }
if(Shell.start({page:'home', title:'הבית שלי', onParentClose:render})){
  if(S.newAnimal){ welcome(S.newAnimal); S.newAnimal=null; save(); }
  if(S.chosen && !S.q && !S.pendingChallenge && !S.challenge) nextQ();
  render();
}
</script></body></html>
